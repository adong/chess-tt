<script>
/* TT Chess: the rules of chess, the CPU levels and your brother's hint. No Three.js and no page in here, so the same
   file runs the game and the headless checks (js/check.js, tools/check.js under Node).
   - The board is 0x88 inside (square = rank * 16 + file, rank 0 is White's back row); outside, squares are 0..63
     (rank * 8 + file). A piece is side * 8 + type: White 1..6, Black 9..14 (pawn, knight, bishop, rook, queen, king).
   - White (W) moves first. Which brother plays White changes from game to game; js/game.js maps W and B to the
     blue (Teddy) and orange (Tommy) pieces.
   - Every rule: all the moves, castling on both sides (the king isn't in check, doesn't pass through or land on an
     attacked square, and neither the king nor that rook has moved), en passant, promotion to a queen, rook, bishop or
     knight, check, checkmate, stalemate, and the draws: threefold repetition, the 50-move rule, not enough pieces left
     to checkmate.
   - The CPU (Foxy 🦊): 🐣 EASY makes gentle mistakes but always takes a free queen; 🔥 NORMAL is alpha-beta 3 moves
     deep with piece-square tables; 🧠 HARD searches deeper for up to about 0.7 s with move ordering (a hash table,
     captures first, killer moves, history), quiescence search and a check extension. A search is a job that the game
     runs a slice at a time (job.step(ms)) so the page never freezes. */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const CH = (root.CH = root.CH || {});

  const W = 0, B = 1;
  const PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  const NAMES = ['', 'PAWN', 'KNIGHT', 'BISHOP', 'ROOK', 'QUEEN', 'KING'];
  const LETTER = ' pnbrqk';
  const VAL = [0, 100, 320, 330, 500, 900, 0];

  // move flags, and a move packed in one int: from | to << 7 | promo << 14 | flags << 17 (squares in 0x88)
  const F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8, F_PROMO = 16;
  const mk = (f, t, p, fl) => f | (t << 7) | (p << 14) | (fl << 17);
  const mFrom = (m) => m & 127, mTo = (m) => (m >> 7) & 127, mPromo = (m) => (m >> 14) & 7, mFlags = (m) => m >> 17;

  const KN = [33, 31, 18, 14, -33, -31, -18, -14];
  const KG = [1, -1, 16, -16, 17, 15, -17, -15];
  const DIAG = [17, 15, -17, -15], ORTH = [1, -1, 16, -16];

  const to88 = (sq) => ((sq >> 3) << 4) | (sq & 7);
  const to64 = (s) => ((s >> 4) << 3) | (s & 7);
  const FILES = 'abcdefgh';
  const sqName = (sq) => FILES[sq & 7] + ((sq >> 3) + 1);
  const sqOf = (name) => (name.charCodeAt(1) - 49) * 8 + (name.charCodeAt(0) - 97);

  // castling rights: 1 White short, 2 White long, 4 Black short, 8 Black long. A king or rook leaving (or a rook
  // being taken on) its first square clears the rights that need it.
  const CASTLE_MASK = new Int8Array(128).fill(15);
  CASTLE_MASK[0x04] = 15 & ~3;
  CASTLE_MASK[0x00] = 15 & ~2;
  CASTLE_MASK[0x07] = 15 & ~1;
  CASTLE_MASK[0x74] = 15 & ~12;
  CASTLE_MASK[0x70] = 15 & ~8;
  CASTLE_MASK[0x77] = 15 & ~4;

  // the sabotages the checks use to prove they can fail (js/check.js). Off in the game.
  const SAB = (CH.sabotage = CH.sabotage || {});

  // ---------------------------------------------------------------- hashing (Zobrist, two 32-bit halves)

  let seed = 0x2545f491;
  const rnd32 = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return (t ^ (t >>> 14)) | 0;
  };
  const Z1 = new Int32Array(16 * 128), Z2 = new Int32Array(16 * 128);
  for (let i = 0; i < Z1.length; i++) {
    Z1[i] = rnd32();
    Z2[i] = rnd32();
  }
  const ZC1 = new Int32Array(16), ZC2 = new Int32Array(16), ZE1 = new Int32Array(8), ZE2 = new Int32Array(8);
  for (let i = 0; i < 16; i++) {
    ZC1[i] = rnd32();
    ZC2[i] = rnd32();
  }
  for (let i = 0; i < 8; i++) {
    ZE1[i] = rnd32();
    ZE2[i] = rnd32();
  }
  const ZT1 = rnd32(), ZT2 = rnd32();

  // ---------------------------------------------------------------- a position

  function Pos(cap = 16384) {
    this.b = new Int8Array(128);
    this.turn = W;
    this.castle = 0;
    this.ep = -1;           // the square a pawn just skipped over (0x88), or -1
    this.half = 0;          // moves since the last capture or pawn move (the 50-move rule counts these)
    this.full = 1;
    this.king = [-1, -1];
    this.h1 = 0;
    this.h2 = 0;
    this.ply = 0;           // the undo stack
    this.uMove = new Int32Array(cap);
    this.uCap = new Int8Array(cap);
    this.uCastle = new Int8Array(cap);
    this.uEp = new Int16Array(cap);
    this.uHalf = new Int16Array(cap);
    this.uH1 = new Int32Array(cap);
    this.uH2 = new Int32Array(cap);
    this.hh = new Int32Array(cap + 64); // the hash after every move (and the start), for repetitions
    this.hp = 0;
  }
  const P = Pos.prototype;

  P.rehash = function () {
    let h1 = 0, h2 = 0;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) {
        s += 7;
        continue;
      }
      const p = this.b[s];
      if (p) {
        h1 ^= Z1[p * 128 + s];
        h2 ^= Z2[p * 128 + s];
      }
    }
    h1 ^= ZC1[this.castle];
    h2 ^= ZC2[this.castle];
    if (this.ep >= 0) {
      h1 ^= ZE1[this.ep & 7];
      h2 ^= ZE2[this.ep & 7];
    }
    if (this.turn === B) {
      h1 ^= ZT1;
      h2 ^= ZT2;
    }
    this.h1 = h1;
    this.h2 = h2;
  };

  // A copy for a search: the board and the repetition history, with a short undo stack of its own.
  P.clone = function (cap = 256) {
    const q = new Pos(this.hp + cap);
    q.b.set(this.b);
    q.turn = this.turn;
    q.castle = this.castle;
    q.ep = this.ep;
    q.half = this.half;
    q.full = this.full;
    q.king = this.king.slice();
    q.h1 = this.h1;
    q.h2 = this.h2;
    q.hh.set(this.hh.subarray(0, this.hp));
    q.hp = this.hp;
    return q;
  };

  // Is square s (0x88) attacked by side `by`?
  P.attacked = function (s, by) {
    if (s < 0) return false;
    const b = this.b;
    const pp = (by << 3) | PAWN;
    const back = by === W ? -16 : 16;
    let t = s + back - 1;
    if (!(t & 0x88) && b[t] === pp) return true;
    t = s + back + 1;
    if (!(t & 0x88) && b[t] === pp) return true;
    const kn = (by << 3) | KNIGHT, kg = (by << 3) | KING;
    for (let i = 0; i < 8; i++) {
      t = s + KN[i];
      if (!(t & 0x88) && b[t] === kn) return true;
      t = s + KG[i];
      if (!(t & 0x88) && b[t] === kg) return true;
    }
    const bi = (by << 3) | BISHOP, ro = (by << 3) | ROOK, qu = (by << 3) | QUEEN;
    for (let i = 0; i < 4; i++) {
      let d = DIAG[i];
      t = s + d;
      while (!(t & 0x88)) {
        const p = b[t];
        if (p) {
          if (p === bi || p === qu) return true;
          break;
        }
        t += d;
      }
      d = ORTH[i];
      t = s + d;
      while (!(t & 0x88)) {
        const p = b[t];
        if (p) {
          if (p === ro || p === qu) return true;
          break;
        }
        t += d;
      }
    }
    return false;
  };

  P.inCheck = function (side = this.turn) {
    return this.attacked(this.king[side], side ^ 1);
  };

  // Every pseudo-legal move for the side to move, pushed onto `out` (captures and queen promotions only if capsOnly).
  P.gen = function (out, capsOnly = false) {
    const b = this.b, us = this.turn, them = us ^ 1;
    const dir = us === W ? 16 : -16, startRank = us === W ? 1 : 6, lastRank = us === W ? 7 : 0;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) {
        s += 7;
        continue;
      }
      const p = b[s];
      if (!p || p >> 3 !== us) continue;
      const type = p & 7;
      if (type === PAWN) {
        const one = s + dir;
        const promo = one >> 4 === lastRank;
        if (!(one & 0x88) && !b[one]) {
          if (promo) {
            out.push(mk(s, one, QUEEN, F_PROMO));
            if (!capsOnly) {
              out.push(mk(s, one, ROOK, F_PROMO));
              out.push(mk(s, one, BISHOP, F_PROMO));
              out.push(mk(s, one, KNIGHT, F_PROMO));
            }
          } else if (!capsOnly) {
            out.push(mk(s, one, 0, 0));
            const two = one + dir;
            if (s >> 4 === startRank && !b[two] && !SAB.nodouble) out.push(mk(s, two, 0, F_DOUBLE));
          }
        }
        for (const t of [one - 1, one + 1]) {
          if (t & 0x88) continue;
          const q = b[t];
          if (q && q >> 3 === them) {
            if (promo) {
              out.push(mk(s, t, QUEEN, F_PROMO | F_CAP));
              if (!capsOnly) {
                out.push(mk(s, t, ROOK, F_PROMO | F_CAP));
                out.push(mk(s, t, BISHOP, F_PROMO | F_CAP));
                out.push(mk(s, t, KNIGHT, F_PROMO | F_CAP));
              }
            } else out.push(mk(s, t, 0, F_CAP));
          } else if (t === this.ep && !q && !SAB.noep) out.push(mk(s, t, 0, F_EP | F_CAP));
        }
      } else if (type === KNIGHT || type === KING) {
        const steps = type === KNIGHT ? KN : KG;
        for (let i = 0; i < 8; i++) {
          const t = s + steps[i];
          if (t & 0x88) continue;
          const q = b[t];
          if (!q) {
            if (!capsOnly) out.push(mk(s, t, 0, 0));
          } else if (q >> 3 === them) out.push(mk(s, t, 0, F_CAP));
        }
        if (type === KING && !capsOnly) this.genCastles(out, s);
      } else {
        const rays = type === BISHOP ? DIAG : type === ROOK ? ORTH : KG;
        for (let i = 0; i < rays.length; i++) {
          const d = rays[i];
          let t = s + d;
          while (!(t & 0x88)) {
            const q = b[t];
            if (!q) {
              if (!capsOnly) out.push(mk(s, t, 0, 0));
            } else {
              if (q >> 3 === them) out.push(mk(s, t, 0, F_CAP));
              break;
            }
            t += d;
          }
        }
      }
    }
    return out;
  };

  // Castling: the right still there (neither piece has moved), the rook in its corner, the squares between empty,
  // and the king not in check, not passing through an attacked square and not landing on one.
  P.genCastles = function (out, s) {
    const b = this.b, us = this.turn, them = us ^ 1, base = us === W ? 0 : 0x70;
    if (s !== base + 4) return;
    const rook = (us << 3) | ROOK;
    const safe = (sq) => SAB.castlecheck || !this.attacked(sq, them);
    if (this.castle & (us === W ? 1 : 4) && b[base + 7] === rook && !b[base + 5] && !b[base + 6]) {
      if (safe(base + 4) && safe(base + 5) && this.safeLanding(base + 6)) out.push(mk(s, base + 6, 0, F_CASTLE));
    }
    if (this.castle & (us === W ? 2 : 8) && b[base] === rook && !b[base + 1] && !b[base + 2] && !b[base + 3]) {
      if (safe(base + 4) && safe(base + 3) && this.safeLanding(base + 2)) out.push(mk(s, base + 2, 0, F_CASTLE));
    }
  };
  // (landing in check is caught by the legality test after the move anyway; this keeps castles out of the list early)
  P.safeLanding = function (sq) {
    return !this.attacked(sq, this.turn ^ 1);
  };

  P.make = function (m) {
    const b = this.b, from = m & 127, to = (m >> 7) & 127, pr = (m >> 14) & 7, fl = m >> 17;
    const p = b[from], side = p >> 3;
    const u = this.ply++;
    this.uMove[u] = m;
    this.uCastle[u] = this.castle;
    this.uEp[u] = this.ep;
    this.uHalf[u] = this.half;
    this.uH1[u] = this.h1;
    this.uH2[u] = this.h2;
    let h1 = this.h1, h2 = this.h2;
    let cap;
    if (fl & F_EP) {
      const cs = to + (side === W ? -16 : 16);
      cap = b[cs];
      b[cs] = 0;
      h1 ^= Z1[cap * 128 + cs];
      h2 ^= Z2[cap * 128 + cs];
    } else {
      cap = b[to];
      if (cap) {
        h1 ^= Z1[cap * 128 + to];
        h2 ^= Z2[cap * 128 + to];
      }
    }
    this.uCap[u] = cap;
    h1 ^= Z1[p * 128 + from];
    h2 ^= Z2[p * 128 + from];
    b[from] = 0;
    const np = pr ? (side << 3) | pr : p;
    b[to] = np;
    h1 ^= Z1[np * 128 + to];
    h2 ^= Z2[np * 128 + to];
    if ((p & 7) === KING) {
      this.king[side] = to;
      if (fl & F_CASTLE) {
        const rf = to > from ? from + 3 : from - 4, rt = to > from ? from + 1 : from - 1, r = b[rf];
        b[rf] = 0;
        b[rt] = r;
        h1 ^= Z1[r * 128 + rf] ^ Z1[r * 128 + rt];
        h2 ^= Z2[r * 128 + rf] ^ Z2[r * 128 + rt];
      }
    }
    h1 ^= ZC1[this.castle];
    h2 ^= ZC2[this.castle];
    if (!SAB.castlemoved) this.castle &= CASTLE_MASK[from] & CASTLE_MASK[to];
    h1 ^= ZC1[this.castle];
    h2 ^= ZC2[this.castle];
    if (this.ep >= 0) {
      h1 ^= ZE1[this.ep & 7];
      h2 ^= ZE2[this.ep & 7];
    }
    this.ep = fl & F_DOUBLE ? (from + to) >> 1 : -1;
    if (this.ep >= 0) {
      h1 ^= ZE1[this.ep & 7];
      h2 ^= ZE2[this.ep & 7];
    }
    this.half = (p & 7) === PAWN || cap ? 0 : this.half + 1;
    if (side === B) this.full++;
    this.turn ^= 1;
    h1 ^= ZT1;
    h2 ^= ZT2;
    this.h1 = h1;
    this.h2 = h2;
    this.hh[this.hp++] = h1;
  };

  P.unmake = function () {
    const u = --this.ply;
    const m = this.uMove[u], b = this.b;
    const from = m & 127, to = (m >> 7) & 127, pr = (m >> 14) & 7, fl = m >> 17;
    this.turn ^= 1;
    const side = this.turn;
    let p = b[to];
    if (pr) p = (side << 3) | PAWN;
    b[from] = p;
    b[to] = 0;
    if (fl & F_EP) b[to + (side === W ? -16 : 16)] = this.uCap[u];
    else b[to] = this.uCap[u];
    if ((p & 7) === KING) {
      this.king[side] = from;
      if (fl & F_CASTLE) {
        const rf = to > from ? from + 3 : from - 4, rt = to > from ? from + 1 : from - 1;
        b[rf] = b[rt];
        b[rt] = 0;
      }
    }
    this.castle = this.uCastle[u];
    this.ep = this.uEp[u];
    this.half = this.uHalf[u];
    this.h1 = this.uH1[u];
    this.h2 = this.uH2[u];
    if (side === B) this.full--;
    this.hp--;
  };

  // Make m if it doesn't leave your own king in check; true if it was made.
  P.tryMake = function (m) {
    const us = this.turn;
    this.make(m);
    if (!SAB.selfcheck && this.attacked(this.king[us], us ^ 1)) {
      this.unmake();
      return false;
    }
    return true;
  };

  P.legal = function () {
    const out = [];
    for (const m of this.gen([])) {
      if (this.tryMake(m)) {
        this.unmake();
        out.push(m);
      }
    }
    return out;
  };

  P.perft = function (d) {
    if (d === 0) return 1;
    const list = this.gen([]);
    let n = 0;
    for (let i = 0; i < list.length; i++) {
      if (!this.tryMake(list[i])) continue;
      n += d === 1 ? 1 : this.perft(d - 1);
      this.unmake();
    }
    return n;
  };

  // The position seen before (for the threefold rule): the same pieces, side to move, castling rights and en passant.
  // En passant only counts when a pawn could really take that way, so the hash drops it otherwise.
  P.key = function () {
    let h1 = this.h1, h2 = this.h2;
    if (this.ep >= 0 && !this.legal().some((m) => (m >> 17) & F_EP)) {
      h1 ^= ZE1[this.ep & 7];
      h2 ^= ZE2[this.ep & 7];
    }
    return (h1 >>> 0).toString(36) + ':' + (h2 >>> 0).toString(36);
  };

  // Not enough left for anyone to checkmate: king against king, a king and one bishop or knight against a king, or
  // kings and bishops that all stand on the same colour of square.
  P.deadDraw = function () {
    if (SAB.nomaterial) return false;
    let minors = 0, knights = 0, light = 0, dark = 0;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) {
        s += 7;
        continue;
      }
      const t = this.b[s] & 7;
      if (!t || t === KING) continue;
      if (t === PAWN || t === ROOK || t === QUEEN) return false;
      minors++;
      if (t === KNIGHT) knights++;
      else if (((s >> 4) + (s & 7)) & 1) light++;
      else dark++;
    }
    if (minors <= 1) return true;
    return knights === 0 && (light === 0 || dark === 0);
  };

  // ---------------------------------------------------------------- FEN

  const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  function fromFen(fen = START) {
    const pos = new Pos();
    const [placement, turn, castle, ep, half, full] = fen.trim().split(/\s+/);
    let r = 7, f = 0;
    for (const ch of placement) {
      if (ch === '/') {
        r--;
        f = 0;
      } else if (/\d/.test(ch)) f += +ch;
      else {
        const t = LETTER.indexOf(ch.toLowerCase());
        const side = ch === ch.toLowerCase() ? B : W;
        const s = r * 16 + f;
        pos.b[s] = (side << 3) | t;
        if (t === KING) pos.king[side] = s;
        f++;
      }
    }
    pos.turn = turn === 'b' ? B : W;
    pos.castle = (castle || '-').split('').reduce((a, c) => a | ({ K: 1, Q: 2, k: 4, q: 8 }[c] || 0), 0);
    pos.ep = ep && ep !== '-' ? to88(sqOf(ep)) : -1;
    pos.half = +(half || 0);
    pos.full = +(full || 1);
    pos.rehash();
    pos.hh[pos.hp++] = pos.h1;
    return pos;
  }
  function toFen(pos) {
    let out = '';
    for (let r = 7; r >= 0; r--) {
      let empty = 0;
      for (let f = 0; f < 8; f++) {
        const p = pos.b[r * 16 + f];
        if (!p) empty++;
        else {
          if (empty) out += empty;
          empty = 0;
          const l = LETTER[p & 7];
          out += p >> 3 === W ? l.toUpperCase() : l;
        }
      }
      if (empty) out += empty;
      if (r) out += '/';
    }
    const c = (pos.castle & 1 ? 'K' : '') + (pos.castle & 2 ? 'Q' : '') + (pos.castle & 4 ? 'k' : '') + (pos.castle & 8 ? 'q' : '') || '-';
    return `${out} ${pos.turn === W ? 'w' : 'b'} ${c} ${pos.ep >= 0 ? sqName(to64(pos.ep)) : '-'} ${pos.half} ${pos.full}`;
  }

  const uci = (m) => sqName(to64(mFrom(m))) + sqName(to64(mTo(m))) + (mPromo(m) ? LETTER[mPromo(m)] : '');

  // ---------------------------------------------------------------- evaluation (centipawns, for the side to move)

  // piece-square tables (Tomasz Michniewski's "simplified evaluation function"), from White's side, rank 8 first
  const PST_SRC = {
    1: [0, 0, 0, 0, 0, 0, 0, 0, 50, 50, 50, 50, 50, 50, 50, 50, 10, 10, 20, 30, 30, 20, 10, 10, 5, 5, 10, 25, 25, 10, 5, 5, 0, 0, 0, 20, 20, 0, 0, 0, 5, -5, -10, 0, 0, -10, -5, 5, 5, 10, 10, -20, -20, 10, 10, 5, 0, 0, 0, 0, 0, 0, 0, 0],
    2: [-50, -40, -30, -30, -30, -30, -40, -50, -40, -20, 0, 0, 0, 0, -20, -40, -30, 0, 10, 15, 15, 10, 0, -30, -30, 5, 15, 20, 20, 15, 5, -30, -30, 0, 15, 20, 20, 15, 0, -30, -30, 5, 10, 15, 15, 10, 5, -30, -40, -20, 0, 5, 5, 0, -20, -40, -50, -40, -30, -30, -30, -30, -40, -50],
    3: [-20, -10, -10, -10, -10, -10, -10, -20, -10, 0, 0, 0, 0, 0, 0, -10, -10, 0, 5, 10, 10, 5, 0, -10, -10, 5, 5, 10, 10, 5, 5, -10, -10, 0, 10, 10, 10, 10, 0, -10, -10, 10, 10, 10, 10, 10, 10, -10, -10, 5, 0, 0, 0, 0, 5, -10, -20, -10, -10, -10, -10, -10, -10, -20],
    4: [0, 0, 0, 0, 0, 0, 0, 0, 5, 10, 10, 10, 10, 10, 10, 5, -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5, 0, 0, 0, 5, 5, 0, 0, 0],
    5: [-20, -10, -10, -5, -5, -10, -10, -20, -10, 0, 0, 0, 0, 0, 0, -10, -10, 0, 5, 5, 5, 5, 0, -10, -5, 0, 5, 5, 5, 5, 0, -5, 0, 0, 5, 5, 5, 5, 0, -5, -10, 5, 5, 5, 5, 5, 0, -10, -10, 0, 5, 0, 0, 0, 0, -10, -20, -10, -10, -5, -5, -10, -10, -20],
    6: [-30, -40, -40, -50, -50, -40, -40, -30, -30, -40, -40, -50, -50, -40, -40, -30, -30, -40, -40, -50, -50, -40, -40, -30, -30, -40, -40, -50, -50, -40, -40, -30, -20, -30, -30, -40, -40, -30, -30, -20, -10, -20, -20, -20, -20, -20, -20, -10, 20, 20, 0, 0, 0, 0, 20, 20, 20, 30, 10, 0, 0, 10, 30, 20],
    7: [-50, -40, -30, -20, -20, -30, -40, -50, -30, -20, -10, 0, 0, -10, -20, -30, -30, -10, 20, 30, 30, 20, -10, -30, -30, -10, 30, 40, 40, 30, -10, -30, -30, -10, 30, 40, 40, 30, -10, -30, -30, -10, 20, 30, 30, 20, -10, -30, -30, -30, 0, 0, 0, 0, -30, -30, -50, -30, -30, -30, -30, -30, -30, -50],
  };
  // PST[side][type 1..7 (7 = the king in the endgame)][0x88 square]
  const PST = [[], []];
  for (let t = 1; t <= 7; t++) {
    for (const side of [W, B]) {
      const a = new Int16Array(128);
      for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) a[r * 16 + f] = PST_SRC[t][(side === W ? 7 - r : r) * 8 + f];
      PST[side][t] = a;
    }
  }
  const centerDist = (s) => Math.max(3 - (s >> 4), (s >> 4) - 4, 0) + Math.max(3 - (s & 7), (s & 7) - 4, 0);

  P.evaluate = function () {
    const b = this.b;
    let mg = 0, kingMg = 0, kingEg = 0, phase = 0;
    const mat = [0, 0], pawns = [0, 0], bishops = [0, 0];
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) {
        s += 7;
        continue;
      }
      const p = b[s];
      if (!p) continue;
      const side = p >> 3, t = p & 7, sg = side === W ? 1 : -1;
      if (t === KING) {
        kingMg += sg * PST[side][KING][s];
        kingEg += sg * PST[side][7][s];
        continue;
      }
      mg += sg * (VAL[t] + PST[side][t][s]);
      if (t === PAWN) pawns[side]++;
      else {
        mat[side] += VAL[t];
        phase += t === QUEEN ? 4 : t === ROOK ? 2 : 1;
        if (t === BISHOP) bishops[side]++;
      }
    }
    // the king hides in the middlegame and comes out in the endgame
    const ph = Math.min(24, phase) / 24;
    let e = mg + Math.round(kingMg * ph + kingEg * (1 - ph));
    if (bishops[W] >= 2) e += 30;
    if (bishops[B] >= 2) e -= 30;
    // mop-up: way ahead with no pawns left on the other side, drive their king to the edge and bring yours close
    for (const side of [W, B]) {
      const o = side ^ 1;
      if (!pawns[o] && mat[side] + pawns[side] * 100 - mat[o] >= 400) {
        const ks = this.king[side], ko = this.king[o];
        if (ks >= 0 && ko >= 0) {
          const near = 14 - (Math.abs((ks >> 4) - (ko >> 4)) + Math.abs((ks & 7) - (ko & 7)));
          e += (side === W ? 1 : -1) * (10 * centerDist(ko) + 4 * near);
        }
      }
    }
    return this.turn === W ? e : -e;
  };

  // ---------------------------------------------------------------- search

  const MATE = 100000, INF = 1000000;
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  // how each level searches (game.js and the checks may pass changes: CH.level('hard', { time: 150 }))
  const LEVELS = {
    easy: { easy: true },
    normal: { depth: 3, qs: false, margin: 18, order: false },
    hard: { depth: 64, minDepth: 3, qs: true, margin: 0, order: true, time: 700, ext: true },
    hint: { depth: 3, qs: false, margin: 0, order: false },
  };
  CH.LEVELS = LEVELS;

  const TT_SIZE = 1 << 18;
  const tt = { k1: new Int32Array(TT_SIZE), k2: new Int32Array(TT_SIZE), move: new Int32Array(TT_SIZE), score: new Int32Array(TT_SIZE), depth: new Int8Array(TT_SIZE), flag: new Int8Array(TT_SIZE) };
  const TT_EXACT = 1, TT_LOWER = 2, TT_UPPER = 3;

  function Searcher(pos, cfg, rng) {
    this.pos = pos;
    this.cfg = cfg;
    this.rng = rng;
    this.nodes = 0;
    this.deadline = Infinity;
    this.abort = false;
    this.killers = new Int32Array(128 * 2);
    this.history = new Int32Array(16 * 128);
    this.lists = [];
    this.frames = [];
    this.stack = [];
    this.value = 0;
  }
  const S = Searcher.prototype;

  S.repeated = function () {
    const pos = this.pos, h = pos.h1;
    const lim = Math.max(0, pos.hp - 1 - pos.half);
    for (let i = pos.hp - 3; i >= lim; i -= 2) if (pos.hh[i] === h) return true;
    return false;
  };

  // Order moves: the hash move, then captures (most valuable victim, least valuable attacker), promotions, the killers
  // and the history of good quiet moves.
  S.order = function (list, ply, ttMove) {
    const b = this.pos.b, keys = new Array(list.length);
    for (let i = 0; i < list.length; i++) {
      const m = list[i], fl = m >> 17;
      let k = 0;
      if (m === ttMove) k = 1e7;
      else if (fl & F_CAP) {
        const victim = fl & F_EP ? PAWN : b[(m >> 7) & 127] & 7;
        k = 1e6 + VAL[victim] * 10 - (b[m & 127] & 7);
      } else if (fl & F_PROMO) k = 9e5 + ((m >> 14) & 7);
      else if (this.cfg.order && (m === this.killers[ply * 2] || m === this.killers[ply * 2 + 1])) k = 8e5;
      else if (this.cfg.order) k = this.history[(b[m & 127] & 15) * 128 + ((m >> 7) & 127)];
      keys[i] = k;
    }
    // insertion sort, highest first (lists are short)
    for (let i = 1; i < list.length; i++) {
      const m = list[i], k = keys[i];
      let j = i - 1;
      while (j >= 0 && keys[j] < k) {
        list[j + 1] = list[j];
        keys[j + 1] = keys[j];
        j--;
      }
      list[j + 1] = m;
      keys[j + 1] = k;
    }
    return list;
  };

  S.listFor = function (ply) {
    const l = this.lists[ply] || (this.lists[ply] = []);
    l.length = 0;
    return l;
  };

  S.qsearch = function (alpha, beta, ply) {
    this.nodes++;
    const pos = this.pos;
    const stand = pos.evaluate();
    if (stand >= beta) return stand;
    if (stand > alpha) alpha = stand;
    if (ply > 60) return stand;
    const list = this.order(pos.gen(this.listFor(ply), true), ply, 0);
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      // delta pruning: even winning this piece can't lift the score up to alpha
      const fl = m >> 17;
      const gain = (fl & F_EP ? 100 : VAL[pos.b[(m >> 7) & 127] & 7]) + (fl & F_PROMO ? 800 : 0);
      if (stand + gain + 200 < alpha) continue;
      if (!pos.tryMake(m)) continue;
      const score = -this.qsearch(-beta, -alpha, ply + 1);
      pos.unmake();
      if (score >= beta) return score;
      if (score > alpha) alpha = score;
    }
    return alpha;
  };

  // The search is a loop over an explicit stack (one frame per ply: its moves and how far it has got), not
  // recursion, so a job can stop in the middle of a deep search when its slice of the frame is used up and carry on
  // next frame. (Quiescence search stays recursive: its trees are small.)
  const PENDING = 0x7fffffff;
  // Start a node: its score straight away (a leaf, a draw, a hash hit) or PENDING after pushing its frame.
  S.enter = function (depth, alpha, beta, ply) {
    const pos = this.pos, cfg = this.cfg;
    if (ply > 0 && (pos.half >= 100 || this.repeated())) return 0;
    this.nodes++;
    const check = pos.inCheck();
    if (check && cfg.ext && ply < 40) depth++;
    if (depth <= 0) return cfg.qs ? this.qsearch(alpha, beta, ply) : pos.evaluate();
    let ttMove = 0;
    const ix = pos.h1 & (TT_SIZE - 1);
    if (cfg.order && tt.k1[ix] === pos.h1 && tt.k2[ix] === pos.h2) {
      ttMove = tt.move[ix];
      if (tt.depth[ix] >= depth && ply > 0) {
        const sc = tt.score[ix], fl = tt.flag[ix];
        if (fl === TT_EXACT || (fl === TT_LOWER && sc >= beta) || (fl === TT_UPPER && sc <= alpha)) return sc;
      }
    }
    const f = this.frames[ply] || (this.frames[ply] = {});
    f.depth = depth;
    f.alpha = f.alpha0 = alpha;
    f.beta = beta;
    f.ply = ply;
    f.check = check;
    f.ix = ix;
    f.list = this.order(pos.gen(this.listFor(ply)), ply, ttMove);
    f.i = 0;
    f.best = -INF;
    f.bestMove = 0;
    f.legal = 0;
    f.cur = 0;
    this.stack.push(f);
    return PENDING;
  };
  // the score of the move frame f just searched: a new best, a new alpha, or a cut-off
  S.score = function (f, sc) {
    if (sc <= f.best) return;
    f.best = sc;
    f.bestMove = f.cur;
    if (sc <= f.alpha) return;
    f.alpha = sc;
    if (sc < f.beta) return;
    const m = f.cur, ply = f.ply;
    if (this.cfg.order && !((m >> 17) & F_CAP)) {
      if (this.killers[ply * 2] !== m) {
        this.killers[ply * 2 + 1] = this.killers[ply * 2];
        this.killers[ply * 2] = m;
      }
      this.history[(this.pos.b[m & 127] & 15) * 128 + ((m >> 7) & 127)] += f.depth * f.depth;
    }
    f.i = f.list.length; // cut off: no need to try the rest
  };
  // a frame is done: its score (mate or stalemate if it had no legal move), kept in the hash table
  S.leave = function (f) {
    if (!f.legal) return f.check ? -MATE + f.ply : 0;
    if (this.cfg.order) {
      const pos = this.pos, ix = f.ix;
      tt.k1[ix] = pos.h1;
      tt.k2[ix] = pos.h2;
      tt.move[ix] = f.bestMove;
      tt.score[ix] = f.best;
      tt.depth[ix] = f.depth;
      tt.flag[ix] = f.best <= f.alpha0 ? TT_UPPER : f.best >= f.beta ? TT_LOWER : TT_EXACT;
    }
    return f.best;
  };
  // Search the position from `ply`: true when finished (the score in this.value), false if it needs run().
  S.begin = function (depth, alpha, beta, ply) {
    this.stack.length = 0;
    const v = this.enter(depth, alpha, beta, ply);
    if (v === PENDING) return false;
    this.value = v;
    return true;
  };
  // Carry on until the search finishes (true), the time `until` comes (false) or the job's deadline passes
  // (false, with this.abort set).
  S.run = function (until) {
    const pos = this.pos, st = this.stack;
    let n = 0;
    while (st.length) {
      if ((++n & 31) === 0) {
        const t = now();
        if (t > this.deadline) {
          this.abort = true;
          return false;
        }
        if (t > until) return false;
      }
      const f = st[st.length - 1];
      if (f.i >= f.list.length) {
        const v = this.leave(f);
        st.pop();
        if (!st.length) {
          this.value = v;
          return true;
        }
        pos.unmake();
        this.score(st[st.length - 1], -v);
        continue;
      }
      const m = f.list[f.i++];
      if (!pos.tryMake(m)) continue;
      f.legal++;
      f.cur = m;
      const v = this.enter(f.depth - 1, -f.beta, -f.alpha, f.ply + 1);
      if (v !== PENDING) {
        pos.unmake();
        this.score(f, -v);
      }
    }
    return true;
  };

  // A search job for the side to move. job.step(ms) works for about that long and returns true when it's done;
  // job.result is then { move, score, depth, nodes }. The game calls step a slice per frame; the checks run it to
  // the end in one go (job.run()).
  function Job(pos, levelName, opts = {}) {
    const cfg = Object.assign({}, LEVELS[levelName] || LEVELS.normal, opts.cfg || {});
    this.cfg = cfg;
    this.rng = opts.rng || Math.random;
    this.pos = pos.clone();
    this.done = false;
    this.result = null;
    this.t0 = -1;
    this.elapsed = 0;
    if (cfg.easy) return this.finish(easyMove(this.pos, this.rng));
    const root = this.pos.legal();
    if (!root.length) return this.finish(0);
    this.s = new Searcher(this.pos, cfg, this.rng);
    this.s.order(root, 0, 0);
    this.root = root.map((m) => ({ m, score: -INF }));
    this.running = false;
    this.depth = 1;
    this.i = 0;
    this.best = -INF;
    this.last = null; // the last finished depth's ranking
  }
  Job.prototype.finish = function (m, score = 0, depth = 0) {
    this.done = true;
    this.result = { move: m, score, depth, nodes: this.s ? this.s.nodes : 0, ms: Math.round(this.elapsed) };
    return this;
  };
  Job.prototype.step = function (ms = 8) {
    if (this.done) return true;
    const start = now();
    if (this.t0 < 0) {
      this.t0 = start;
      if (this.cfg.time) this.s.deadline = start + this.cfg.time;
    }
    const cfg = this.cfg, s = this.s, pos = this.pos;
    const until = ms > 0 ? start + ms : Infinity;
    for (;;) {
      let finished;
      if (!this.running) {
        // the next root move: the window gives exact scores for moves within `margin` of the best so far (to pick
        // among them), bounds otherwise
        const alpha = this.best === -INF ? -INF : this.best - cfg.margin - 1;
        pos.make(this.root[this.i].m);
        this.running = true;
        finished = s.begin(this.depth - 1, -INF, -alpha, 1) || s.run(until);
      } else finished = s.run(until);
      if (!finished) {
        if (s.abort) {
          while (pos.ply > 0) pos.unmake();
          this.running = false;
          return this.stop(start);
        }
        this.elapsed += now() - start;
        return false;
      }
      pos.unmake();
      this.running = false;
      const r = this.root[this.i];
      r.score = -s.value;
      if (r.score > this.best) this.best = r.score;
      this.i++;
      if (this.i >= this.root.length) {
        // a depth is finished: rank the moves (stable, so earlier ones win ties) and go one deeper
        this.root.sort((a, b) => b.score - a.score);
        this.last = { depth: this.depth, list: this.root.map((x) => ({ m: x.m, score: x.score })) };
        const mateFound = Math.abs(this.root[0].score) > MATE - 200;
        const used = now() - this.t0;
        const deeper = this.depth < cfg.depth && !mateFound && (!cfg.time || this.depth < (cfg.minDepth || 1) || used < cfg.time * 0.4);
        if (!deeper) return this.pick(start);
        this.depth++;
        this.i = 0;
        this.best = -INF;
      }
      if (now() >= until) {
        this.elapsed += now() - start;
        return false;
      }
    }
  };
  // out of time in the middle of a depth: keep the last full depth, or this one's best if it beat that
  Job.prototype.stop = function (start) {
    const prev = this.last ? this.last.list[0] : null;
    const cur = this.root.slice(0, this.i).sort((a, b) => b.score - a.score)[0];
    this.elapsed += now() - start;
    if (prev && (!cur || cur.score <= prev.score || this.i === 0)) return this.finish(prev.m, prev.score, this.last.depth) && true;
    if (cur) return this.finish(cur.m, cur.score, this.depth) && true;
    return this.finish(this.root[0].m, 0, 0) && true;
  };
  // the best move, or one of the moves within `margin` of it (a little variety, so games differ)
  Job.prototype.pick = function (start) {
    this.elapsed += now() - start;
    const list = this.last.list, top = list[0].score;
    const near = list.filter((x) => x.score >= top - this.cfg.margin && Math.abs(top) < MATE - 200);
    const choice = near.length > 1 ? near[Math.floor(this.rng() * near.length)] : list[0];
    this.finish(choice.m, choice.score, this.last.depth);
    this.ranked = list;
    return true;
  };
  Job.prototype.run = function () {
    while (!this.done) this.step(0);
    return this.result;
  };

  // ---------------------------------------------------------------- 🐣 EASY

  // Static exchange on one square, roughly: what you win taking there, if they take back with their cheapest piece.
  function hangs(pos, sq, side) {
    return pos.attacked(sq, side ^ 1);
  }
  const EASY = { mate: 0.6, grab: 0.75, look: 0.45, noise: 140 };
  CH.EASY = EASY;
  function easyMove(pos, rng) {
    const us = pos.turn, them = us ^ 1;
    let moves = pos.legal();
    if (!moves.length) return 0;
    // (the sabotage: EASY never sees a queen it could take)
    if (SAB.easyblind && moves.some((m) => (pos.b[(m >> 7) & 127] & 7) !== QUEEN)) moves = moves.filter((m) => (pos.b[(m >> 7) & 127] & 7) !== QUEEN);
    const pick = (list) => list[Math.floor(rng() * list.length)];
    // a free queen: always (an undefended queen, or one taken by a cheaper piece)
    const queens = moves.filter((m) => {
      const fl = m >> 17;
      if (!(fl & F_CAP) || fl & F_EP) return false;
      const victim = pos.b[(m >> 7) & 127] & 7;
      if (victim !== QUEEN) return false;
      const att = pos.b[m & 127] & 7;
      return att !== QUEEN || !pos.attacked((m >> 7) & 127, them);
    });
    if (queens.length) return pick(queens);
    // checkmate in one, most of the time
    if (rng() < EASY.mate) {
      const mates = moves.filter((m) => {
        pos.make(m);
        const mate = pos.inCheck() && !pos.legal().length;
        pos.unmake();
        return mate;
      });
      if (mates.length) return pick(mates);
    }
    // free pieces: grab an undefended one most of the time
    if (rng() < EASY.grab) {
      const free = moves.filter((m) => (m >> 17) & F_CAP && !((m >> 17) & F_EP) && !pos.attacked((m >> 7) & 127, them));
      if (free.length) return free.sort((a, b) => (pos.b[(b >> 7) & 127] & 7) - (pos.b[(a >> 7) & 127] & 7))[0];
    }
    // otherwise: one move ahead with plenty of noise, and only sometimes a look at whether the piece is safe there
    const look = rng() < EASY.look;
    let best = 0, bestScore = -INF;
    for (const m of moves) {
      pos.make(m);
      let sc = -pos.evaluate();
      if (look && hangs(pos, (m >> 7) & 127, us)) sc -= VAL[pos.b[(m >> 7) & 127] & 7] * 0.8;
      pos.unmake();
      sc += (rng() - 0.5) * 2 * EASY.noise;
      if (sc > bestScore) {
        bestScore = sc;
        best = m;
      }
    }
    return best;
  }

  // ---------------------------------------------------------------- the game

  // A game: the position, the keys of every position so far (for the threefold rule) and the moves.
  function newGame(fen) {
    const pos = fromFen(fen || START);
    const g = { pos, keys: [pos.key()], moves: [], over: false, winner: -1, reason: '', check: false };
    status(g);
    return g;
  }

  // Is the game over, and why? Checkmate and stalemate first, then the draws.
  function status(g) {
    const pos = g.pos;
    const moves = pos.legal();
    g.check = pos.inCheck();
    g.over = false;
    g.winner = -1;
    g.reason = '';
    if (!moves.length) {
      g.over = true;
      g.reason = g.check ? 'mate' : 'stalemate';
      if (g.check) g.winner = pos.turn ^ 1;
    } else if (pos.half >= 100 && !SAB.nofifty) {
      g.over = true;
      g.reason = 'fifty';
    } else if (pos.deadDraw()) {
      g.over = true;
      g.reason = 'material';
    } else if (!SAB.norepeat) {
      const k = g.keys[g.keys.length - 1];
      let n = 0;
      for (const x of g.keys) if (x === k) n++;
      if (n >= 3) {
        g.over = true;
        g.reason = 'repetition';
      }
    }
    return g;
  }

  // Moves as objects for the page: { from, to, piece, captured, capSq, promo, castle: { from, to } | null, ep, double }
  function describe(pos, m) {
    const from = mFrom(m), to = mTo(m), fl = mFlags(m), p = pos.b[from];
    const side = p >> 3;
    const capSq = fl & F_EP ? to + (side === W ? -16 : 16) : to;
    const o = {
      m, from: to64(from), to: to64(to), piece: p, side, type: p & 7, promo: mPromo(m), ep: !!(fl & F_EP), double: !!(fl & F_DOUBLE),
      captured: fl & F_CAP ? pos.b[capSq] : 0, capSq: fl & F_CAP ? to64(capSq) : -1, castle: null, uci: uci(m),
    };
    if (fl & F_CASTLE) {
      const rf = to > from ? from + 3 : from - 4, rt = to > from ? from + 1 : from - 1;
      o.castle = { from: to64(rf), to: to64(rt), side: to > from ? 'short' : 'long' };
    }
    return o;
  }

  // The legal moves of the piece on square sq (0..63): one per target square (a promotion lists its four choices).
  function legalFrom(g, sq) {
    if (g.over) return [];
    const s = to88(sq);
    const out = [];
    for (const m of g.pos.legal()) {
      if (mFrom(m) !== s) continue;
      const d = describe(g.pos, m);
      const same = out.find((x) => x.to === d.to);
      if (same) same.promos.push(d.promo);
      else {
        d.promos = d.promo ? [d.promo] : [];
        out.push(d);
      }
    }
    return out;
  }

  // Play a move (an int, or { from, to, promo } in 0..63). Returns the move as an object (plus check / over), or null.
  function play(g, mv) {
    if (g.over) return null;
    let m = mv;
    if (typeof mv !== 'number') {
      const f = to88(mv.from), t = to88(mv.to);
      m = g.pos.legal().find((x) => mFrom(x) === f && mTo(x) === t && (!mPromo(x) || mPromo(x) === (mv.promo || QUEEN)));
      if (!m) return null;
    } else if (!g.pos.legal().includes(m)) return null;
    const ev = describe(g.pos, m);
    g.pos.make(m);
    g.moves.push(ev);
    g.keys.push(g.pos.key());
    status(g);
    ev.check = g.check;
    ev.over = g.over;
    return ev;
  }

  function undo(g) {
    if (!g.moves.length) return null;
    const ev = g.moves.pop();
    g.keys.pop();
    g.pos.unmake();
    status(g);
    return ev;
  }

  // Pieces for the page: [{ sq, piece, side, type }]
  function pieces(g) {
    const out = [];
    for (let sq = 0; sq < 64; sq++) {
      const p = g.pos.b[to88(sq)];
      if (p) out.push({ sq, piece: p, side: p >> 3, type: p & 7 });
    }
    return out;
  }
  const at = (g, sq) => g.pos.b[to88(sq)];
  const kingSq = (g, side) => (g.pos.king[side] >= 0 ? to64(g.pos.king[side]) : -1);

  // A search job for the game (game.js steps it a slice a frame).
  const think = (g, level, opts) => new Job(g.pos, level, opts);
  // The best move now, in one go (the checks, the demo board).
  const best = (g, level, opts) => new Job(g.pos, level, opts).run().move;

  // ---------------------------------------------------------------- your brother's hint

  // What he says, from the NORMAL search's best move. Kinds: mate (checkmate now), check (get your king safe),
  // danger (the piece he moves can be bonked where it stands), bonk (a capture), move (a good move).
  function hintFor(g, m) {
    if (!m) return null;
    const pos = g.pos, us = pos.turn, d = describe(pos, m);
    pos.make(m);
    const mate = pos.inCheck() && !pos.legal().length;
    pos.unmake();
    let kind = 'move', target = 0;
    const from88 = mFrom(m);
    if (mate) kind = 'mate';
    else if (g.check) kind = 'check';
    else if (d.type !== PAWN && pos.attacked(from88, us ^ 1) && (VAL[d.type] >= 300 || d.type === KING) && !defendedEnough(pos, from88, us)) {
      kind = 'danger';
      target = d.type;
    } else if (d.captured) {
      kind = 'bonk';
      target = d.captured & 7;
    }
    return { kind, from: d.from, to: d.to, type: d.type, target, promo: d.promo, uci: d.uci };
  }
  // A piece "in danger": attacked by something cheaper, or attacked and not defended.
  function defendedEnough(pos, s, us) {
    const val = VAL[pos.b[s] & 7];
    const them = us ^ 1;
    // the cheapest attacker
    let cheapest = INF;
    for (const m of (() => {
      const save = pos.turn;
      pos.turn = them;
      const l = pos.gen([], true);
      pos.turn = save;
      return l;
    })()) {
      if (mTo(m) === s) cheapest = Math.min(cheapest, VAL[pos.b[mFrom(m)] & 7] || 50);
    }
    if (cheapest < val) return false;
    pos.b[s] ^= 8; // pretend it's theirs: is it defended by us?
    const defended = pos.attacked(s, us);
    pos.b[s] ^= 8;
    return defended;
  }

  Object.assign(CH, {
    W, B, PAWN, KNIGHT, BISHOP, ROOK, QUEEN, KING, NAMES, VAL, START, F_CAP, F_EP, F_CASTLE, F_DOUBLE, F_PROMO, MATE,
    Pos, Job, fromFen, toFen, uci, to88, to64, sqName, sqOf, mFrom, mTo, mPromo, mFlags,
    newGame, status, play, undo, legalFrom, describe, pieces, at, kingSq, think, best, hintFor, easyMove,
    sideOf: (p) => p >> 3, typeOf: (p) => p & 7,
    level: (name, cfg) => Object.assign(LEVELS[name], cfg),
    clearTT: () => tt.k1.fill(0),
  });
})();

</script>
<script>
/* TT Chess: the headless checks. The same code runs in the page (game.check()) and under Node (tools/check.js).
   - perft: the number of positions after 1, 2, 3 (and 4) moves from the start and from the standard test positions
     ("Kiwipete" and friends). Any mistake in the moves (castling, en passant, promotion, pins, checks) shows up here.
   - every rule on a little board set up for it: castling (each condition), en passant (now or never, and the pinned
     case), promotion (all four), check, checkmate, stalemate, and the draws (threefold, 50 moves, not enough pieces).
   - the CPU: games between the levels where every move is checked legal and every game must end; NORMAL must beat
     EASY and HARD must beat NORMAL most of the time; EASY always takes a free queen; your brother's hint.
   - sabotage: CH.sabotage[name] = true switches a rule off, and the check must then fail (tools/check.js --sabotage). */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const CH = root.CH;
  const { W, B, QUEEN, ROOK, BISHOP, KNIGHT } = CH;

  function rng32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const PERFT = [
    { name: 'start', fen: CH.START, n: [20, 400, 8902, 197281] },
    { name: 'kiwipete', fen: 'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1', n: [48, 2039, 97862] },
    { name: 'position 3 (en passant, pins)', fen: '8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1', n: [14, 191, 2812, 43238] },
    { name: 'position 4 (promotions, castling)', fen: 'r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1', n: [6, 264, 9467] },
    { name: 'position 5', fen: 'rnbq1k1r/pp1Pbppp/2p5/8/2B5/8/PPP1NnPP/RNBQK2R w KQ - 1 8', n: [44, 1486, 62379] },
  ];

  function perft(quick) {
    const out = [];
    for (const t of PERFT) {
      const pos = CH.fromFen(t.fen);
      t.n.forEach((want, i) => {
        if (quick && i >= 3) return;
        const t0 = Date.now();
        const got = pos.perft(i + 1);
        out.push({ name: `perft ${t.name} depth ${i + 1}`, ok: got === want, got, want, ms: Date.now() - t0 });
      });
    }
    return out;
  }

  // ---------------------------------------------------------------- the rules, one little board each

  function ucis(g, sq) {
    return CH.legalFrom(g, CH.sqOf(sq)).map((m) => m.uci);
  }
  function allUcis(g) {
    return g.pos.legal().map(CH.uci);
  }
  function playAll(g, list) {
    for (const u of list.split(' ')) {
      const promo = u[4] ? ' pnbrqk'.indexOf(u[4]) : 0;
      const ev = CH.play(g, { from: CH.sqOf(u.slice(0, 2)), to: CH.sqOf(u.slice(2, 4)), promo });
      if (!ev) return false;
    }
    return true;
  }

  function rules() {
    const out = [];
    const ok = (name, cond, extra) => out.push(Object.assign({ name, ok: !!cond }, extra || {}));
    const G = (fen) => CH.newGame(fen);

    // the start
    let g = G();
    ok('start: 20 moves, White to move, all castling rights', allUcis(g).length === 20 && g.pos.turn === W && g.pos.castle === 15);
    ok('start: the pawn may step one or two', ucis(g, 'e2').sort().join() === 'e2e3,e2e4');
    ok('start: the knight jumps over the pawns', ucis(g, 'g1').sort().join() === 'g1f3,g1h3');
    ok('start: the bishop, rook, queen and king are stuck', ['c1', 'a1', 'd1', 'e1'].every((s) => !ucis(g, s).length));
    ok('FEN round trip', CH.toFen(CH.newGame('r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1').pos) === 'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1');

    // castling
    g = G('r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1');
    ok('castling: both sides when everything is clear', ucis(g, 'e1').includes('e1g1') && ucis(g, 'e1').includes('e1c1'));
    playAll(g, 'e1g1');
    ok('castling short: king to g1, rook to f1', CH.at(g, CH.sqOf('g1')) === 6 && CH.at(g, CH.sqOf('f1')) === 4 && !CH.at(g, CH.sqOf('h1')));
    playAll(g, 'e8c8');
    ok('castling long: king to c8, rook to d8', CH.at(g, CH.sqOf('c8')) === 14 && CH.at(g, CH.sqOf('d8')) === 12 && !CH.at(g, CH.sqOf('a8')));
    g = G('4r1k1/8/8/8/8/8/8/R3K2R w KQ - 0 1');
    ok('castling: not out of check', !ucis(g, 'e1').some((u) => u === 'e1g1' || u === 'e1c1'));
    g = G('5rk1/8/8/8/8/8/8/R3K2R w KQ - 0 1');
    ok('castling: not through an attacked square (f1)', !ucis(g, 'e1').includes('e1g1') && ucis(g, 'e1').includes('e1c1'));
    g = G('3r2k1/8/8/8/8/8/8/R3K2R w KQ - 0 1');
    ok('castling: not through an attacked square (d1)', !ucis(g, 'e1').includes('e1c1') && ucis(g, 'e1').includes('e1g1'));
    g = G('6rk/8/8/8/8/8/8/R3K2R w KQ - 0 1');
    ok('castling: not into check (g1)', !ucis(g, 'e1').includes('e1g1'));
    g = G('2r3k1/8/8/8/8/8/8/R3K2R w KQ - 0 1');
    ok('castling: not into check (c1)', !ucis(g, 'e1').includes('e1c1'));
    g = G('1r4k1/8/8/8/8/8/8/R3K2R w KQ - 0 1');
    ok('castling long: b1 under attack is fine (the king never crosses it)', ucis(g, 'e1').includes('e1c1'));
    g = G('r3k2r/8/8/8/8/8/8/RN2K1NR w KQkq - 0 1');
    ok('castling: not with a piece in the way', !ucis(g, 'e1').includes('e1c1') && !ucis(g, 'e1').includes('e1g1'));
    g = G('r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1');
    playAll(g, 'e1e2 e8e7 e2e1 e7e8');
    ok('castling: not after the king has moved (even back home)', !ucis(g, 'e1').some((u) => u === 'e1g1' || u === 'e1c1') && g.pos.castle === 0);
    g = G('r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1');
    playAll(g, 'h1h2 a8a7 h2h1 a7a8');
    ok('castling: not with a rook that has moved; the other side still fine', !ucis(g, 'e1').includes('e1g1') && ucis(g, 'e1').includes('e1c1'));
    g = G('r3k2r/8/8/8/8/8/8/R3K2R b KQkq - 0 1');
    playAll(g, 'a8a1');
    ok('castling: the right goes when the rook is taken', !(g.pos.castle & 2) && !(g.pos.castle & 8));
    g = G('4k3/8/8/8/8/8/8/R3K2R w - - 0 1');
    ok('castling: not without the right', !ucis(g, 'e1').some((u) => u === 'e1g1' || u === 'e1c1'));

    // en passant
    g = G('4k3/8/8/8/1p6/8/P7/4K3 w - - 0 1');
    playAll(g, 'a2a4');
    ok('en passant: the pawn that stepped two can be taken as if it stepped one', ucis(g, 'b4').includes('b4a3'));
    const ep = CH.play(g, { from: CH.sqOf('b4'), to: CH.sqOf('a3') });
    ok('en passant: the passed pawn leaves the board', ep && ep.ep && ep.capSq === CH.sqOf('a4') && !CH.at(g, CH.sqOf('a4')) && CH.at(g, CH.sqOf('a3')) === 9);
    g = G('4k3/8/8/8/1p6/8/P7/4K3 w - - 0 1');
    playAll(g, 'a2a4 e8d8 e1d1');
    ok('en passant: only straight away, never later', !ucis(g, 'b4').includes('b4a3'));
    g = G('8/8/8/K1pP3r/8/8/8/7k w - c6 0 1');
    ok('en passant: not when it would leave your king open', !ucis(g, 'd5').includes('d5c6') && ucis(g, 'd5').includes('d5d6'));
    g = G('4k3/8/8/8/8/8/1P6/4K3 w - - 0 1');
    playAll(g, 'b2b4');
    ok('en passant: no square to take on when nobody can', CH.toFen(g.pos).split(' ')[3] === 'b3' && !allUcis(g).some((u) => u.endsWith('b3')));

    // promotion
    g = G('8/P7/8/8/8/8/8/k6K w - - 0 1');
    const pm = CH.legalFrom(g, CH.sqOf('a7'));
    ok('promotion: the pawn on the last row picks queen, rook, bishop or knight', pm.length === 1 && pm[0].promos.slice().sort().join() === [KNIGHT, BISHOP, ROOK, QUEEN].sort().join());
    for (const [p, name] of [[QUEEN, 'queen'], [ROOK, 'rook'], [BISHOP, 'bishop'], [KNIGHT, 'knight']]) {
      const gg = G('8/P7/8/8/8/8/8/k6K w - - 0 1');
      CH.play(gg, { from: CH.sqOf('a7'), to: CH.sqOf('a8'), promo: p });
      ok(`promotion: to a ${name}`, CH.at(gg, CH.sqOf('a8')) === p && !CH.at(gg, CH.sqOf('a7')));
    }
    g = G('1n6/P7/8/8/8/8/8/k6K w - - 0 1');
    ok('promotion: by taking too', CH.legalFrom(g, CH.sqOf('a7')).some((m) => m.uci.startsWith('a7b8') && m.captured));
    g = G('8/P7/8/8/8/8/8/k6K w - - 0 1');
    CH.play(g, { from: CH.sqOf('a7'), to: CH.sqOf('a8'), promo: KNIGHT });
    CH.undo(g);
    ok('promotion: undo puts the pawn back', CH.at(g, CH.sqOf('a7')) === 1 && !CH.at(g, CH.sqOf('a8')));

    // check, checkmate, stalemate
    g = G();
    playAll(g, 'f2f3 e7e5 g2g4');
    const mate = CH.play(g, { from: CH.sqOf('d8'), to: CH.sqOf('h4') });
    ok("checkmate: the fool's mate", mate && mate.check && g.over && g.reason === 'mate' && g.winner === B);
    g = G('6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1');
    CH.play(g, { from: CH.sqOf('a1'), to: CH.sqOf('a8') });
    ok('checkmate: the back row', g.over && g.reason === 'mate' && g.winner === W);
    g = G('6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1');
    CH.play(g, { from: CH.sqOf('g5'), to: CH.sqOf('f7') });
    ok('checkmate: smothered by a knight', g.over && g.reason === 'mate' && g.winner === W);
    g = G('4k3/8/8/8/8/8/3q4/4K3 w - - 0 1');
    ok('check: you must get out of it (take the queen or step to the one safe square)', g.check && allUcis(g).sort().join() === 'e1d2,e1f1');
    g = G('4k3/8/8/8/8/8/8/r3K3 w - - 0 1');
    ok('check: the king may not step along the attacking line', !ucis(g, 'e1').includes('e1d1') && !ucis(g, 'e1').includes('e1f1'));
    g = G('4k3/4r3/8/8/8/8/4B3/4K3 w - - 0 1');
    ok('pins: a pinned piece may not leave the line', !ucis(g, 'e2').length);
    g = G('k7/8/1Q6/8/8/8/8/7K w - - 0 1');
    playAll(g, 'h1g1');
    ok('stalemate: no legal move and not in check is a draw', g.over && g.reason === 'stalemate' && g.winner === -1);
    g = G('7k/8/5KQ1/8/8/8/8/8 b - - 0 1');
    ok('stalemate: from the start of a turn', g.over && g.reason === 'stalemate');
    g = G('7k/8/6K1/8/8/8/8/6Q1 b - - 0 1');
    ok('not stalemate while the king can move', !g.over);

    // threefold repetition
    g = G();
    playAll(g, 'g1f3 g8f6 f3g1 f6g8 g1f3 g8f6 f3g1');
    const before = g.over;
    playAll(g, 'f6g8');
    ok('threefold: the same position three times is a draw (not at two)', !before && g.over && g.reason === 'repetition');
    g = G('4k3/8/8/8/8/8/4P3/4K3 w - - 0 1');
    playAll(g, 'e2e4 e8d8 e1d1 d8e8 d1e1 e8d8 e1d1 d8e8');
    const at2 = g.over;
    playAll(g, 'd1e1');
    ok('threefold: an en passant nobody can take does not make a position new', !at2 && g.over && g.reason === 'repetition');
    g = G('4k3/8/8/8/8/8/8/R3K3 w Q - 0 1');
    playAll(g, 'a1a2 e8d8 a2a1 d8e8 a1a2 e8d8 a2a1 d8e8');
    ok('threefold: lost castling rights make it a new position', !g.over);
    playAll(g, 'a1a2 e8d8 a2a1 d8e8');
    ok('threefold: ...that then repeats', g.over && g.reason === 'repetition');

    // the 50-move rule
    g = G('4k3/8/8/8/8/8/8/R3K3 w - - 98 60');
    playAll(g, 'a1a2');
    const at99 = g.over;
    playAll(g, 'e8d8');
    ok('50 moves: 50 moves each with no capture or pawn move is a draw', !at99 && g.over && g.reason === 'fifty');
    g = G('4k3/8/8/8/8/8/4P3/R3K3 w - - 99 60');
    playAll(g, 'e2e3');
    ok('50 moves: a pawn move starts the count again', !g.over && g.pos.half === 0);
    g = G('7k/5Q2/5K2/8/8/8/8/8 w - - 99 80');
    playAll(g, 'f7g7');
    ok('50 moves: checkmate on the last move still wins', g.over && g.reason === 'mate' && g.winner === W);

    // not enough pieces to checkmate
    const dead = (fen) => G(fen).reason === 'material';
    ok('material: king against king', dead('8/8/8/4k3/8/8/8/4K3 w - - 0 1'));
    ok('material: king and bishop against king', dead('8/8/8/4k3/8/8/8/2B1K3 w - - 0 1'));
    ok('material: king and knight against king', dead('8/8/8/4k3/8/8/8/1N2K3 b - - 0 1'));
    ok('material: bishops all on the same colour', dead('5b2/8/8/4k3/8/8/8/2B1K3 w - - 0 1'));
    ok('material: bishops on both colours can still mate', !dead('2b5/8/8/4k3/8/8/8/2B1K3 w - - 0 1'));
    ok('material: knight against knight can still mate', !dead('1n6/8/8/4k3/8/8/8/1N2K3 w - - 0 1'));
    ok('material: a pawn, a rook or a queen can still mate', ['8/8/8/4k3/8/8/4P3/4K3 w - - 0 1', '8/8/8/4k3/8/8/8/R3K3 w - - 0 1', '8/8/8/4k3/8/8/8/Q3K3 w - - 0 1'].every((f) => !dead(f)));
    g = G('8/8/8/4k3/8/8/3r4/2B1K3 w - - 0 1');
    playAll(g, 'e1d2');
    ok('material: taking the last rook leaves a dead draw', g.over && g.reason === 'material');

    // illegal moves change nothing; undo goes back exactly
    g = G();
    const fen0 = CH.toFen(g.pos);
    ok('an illegal move is refused and changes nothing', !CH.play(g, { from: CH.sqOf('e2'), to: CH.sqOf('e5') }) && CH.toFen(g.pos) === fen0);
    playAll(g, 'e2e4 d7d5 e4d5 g8f6 f1b5 c7c6 d5c6 d8a5 c6b7 a5b5 b7a8q');
    while (g.moves.length) CH.undo(g);
    ok('undo all the way back gives the start again (hash too)', CH.toFen(g.pos) === fen0 && g.pos.key() === CH.newGame().pos.key());

    return out;
  }

  // ---------------------------------------------------------------- the CPU and the hint

  function cpuRules(seed) {
    const out = [];
    const ok = (name, cond, extra) => out.push(Object.assign({ name, ok: !!cond }, extra || {}));
    const rng = rng32(seed);
    // EASY always takes a free queen
    const fens = ['4k3/8/8/3q4/8/8/8/3RK3 w - - 0 1', 'rnb1kbnr/pppp1ppp/8/4p3/4P2q/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 1', '4k3/8/8/8/2q5/1P6/8/4K3 w - - 0 1'];
    let took = 0, tries = 0;
    for (const f of fens) {
      for (let i = 0; i < 25; i++) {
        const g = CH.newGame(f);
        const m = CH.easyMove(g.pos, rng);
        tries++;
        if ((CH.describe(g.pos, m).captured & 7) === QUEEN) took++;
      }
    }
    ok('EASY always takes a free queen', took === tries, { took, tries });
    // every level takes a mate in one
    const mateFen = '6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1';
    for (const lv of ['normal', 'hard']) {
      const g = CH.newGame(mateFen);
      const m = CH.best(g, lv, { rng, cfg: lv === 'hard' ? { time: 300 } : {} });
      ok(`${lv.toUpperCase()} finds the checkmate`, CH.uci(m) === 'a1a8');
    }
    // NORMAL doesn't leave its queen hanging to a pawn
    let g = CH.newGame('rnb1kbnr/pppp1ppp/8/4p3/3qP3/2P5/PP1P1PPP/RNBQKBNR b KQkq - 0 1');
    let m = CH.best(g, 'normal', { rng });
    ok('NORMAL moves its queen away from a pawn', CH.mFrom(m) === CH.to88(CH.sqOf('d4')), { move: CH.uci(m) });
    // HARD sees the queen fork that NORMAL's horizon misses... at least it plays a sound move in a tactical spot
    g = CH.newGame('r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 2 3');
    m = CH.best(g, 'hard', { rng, cfg: { time: 400 } });
    ok("HARD plays the scholar's mate when it's there", CH.uci(m) === 'f3f7', { move: CH.uci(m) });
    // the hint
    g = CH.newGame(mateFen);
    let h = CH.hintFor(g, CH.best(g, 'hint', { rng }));
    ok('hint: checkmate when there is one', h && h.kind === 'mate' && h.uci === 'a1a8', h);
    g = CH.newGame('rnbqkbnr/pp1ppppp/8/2p5/3Q4/4P3/PPP2PPP/RNB1KBNR w KQkq - 0 1');
    playAll(g, 'd4d5 e7e6');
    h = CH.hintFor(g, CH.best(g, 'hint', { rng }));
    ok('hint: your queen is in danger (and he moves it)', h && h.kind === 'danger' && h.type === QUEEN, h);
    g = CH.newGame('4k3/8/8/8/8/8/3q4/4K3 w - - 0 1');
    h = CH.hintFor(g, CH.best(g, 'hint', { rng }));
    ok('hint: get out of check', h && h.kind === 'check', h);
    g = CH.newGame('4k3/8/8/3r4/8/8/8/3RK3 w - - 0 1');
    h = CH.hintFor(g, CH.best(g, 'hint', { rng }));
    ok('hint: bonk a free piece', h && h.kind === 'bonk' && h.target === ROOK, h);
    return out;
  }

  // One CPU game: every move must be legal and the game must end by the rules. Returns who won and why.
  function cpuGame(white, black, rng, opts = {}) {
    const g = CH.newGame(opts.fen);
    const lv = [white, black];
    let legal = true;
    while (!g.over && g.moves.length < (opts.cap || 3000)) {
      const side = g.pos.turn;
      const name = lv[side];
      let m;
      if (name === 'random') {
        const l = g.pos.legal();
        m = l[Math.floor(rng() * l.length)];
      } else m = CH.best(g, name, { rng, cfg: opts.cfg && opts.cfg[name] });
      if (!g.pos.legal().includes(m)) {
        legal = false;
        break;
      }
      CH.play(g, m);
    }
    // the ending must agree with the board
    let sound = g.over;
    if (g.reason === 'mate') sound = g.pos.inCheck() && !g.pos.legal().length;
    if (g.reason === 'stalemate') sound = !g.pos.inCheck() && !g.pos.legal().length;
    if (g.reason === 'fifty') sound = g.pos.half >= 100;
    return { winner: g.winner, reason: g.reason, plies: g.moves.length, legal, ended: g.over, sound };
  }

  // A match: n games, colours swapped every game. score: the first level's wins, the second's, draws.
  function match(a, b, n, rng, opts) {
    const r = { a, b, games: n, wins: 0, losses: 0, draws: 0, reasons: {}, allLegal: true, allEnded: true, longest: 0, ms: 0 };
    const t0 = Date.now();
    for (let i = 0; i < n; i++) {
      const aWhite = i % 2 === 0;
      const res = cpuGame(aWhite ? a : b, aWhite ? b : a, rng, opts);
      r.allLegal = r.allLegal && res.legal;
      r.allEnded = r.allEnded && res.ended && res.sound;
      r.longest = Math.max(r.longest, res.plies);
      r.reasons[res.reason] = (r.reasons[res.reason] || 0) + 1;
      if (res.winner < 0) r.draws++;
      else if ((res.winner === W) === aWhite) r.wins++;
      else r.losses++;
    }
    r.ms = Date.now() - t0;
    return r;
  }

  // Everything. opts: { games (per CPU pairing, default 4), quick (perft without depth 4), sabotage, seed, hardMs }
  function check(opts = {}) {
    const t0 = Date.now();
    const sab = CH.sabotage;
    for (const k of Object.keys(sab)) delete sab[k];
    if (opts.sabotage) sab[opts.sabotage] = true;
    const savedNormal = Object.assign({}, CH.LEVELS.normal);
    if (opts.sabotage === 'blind') CH.level('normal', { depth: 1, margin: 100000 }); // NORMAL plays at random
    CH.clearTT();
    const seed = opts.seed !== undefined ? opts.seed : 20261020;
    const rng = rng32(seed);
    const n = opts.games !== undefined ? opts.games : 4;
    const cfg = { hard: { time: opts.hardMs || 150 } };
    let out;
    try {
      const p = opts.skipPerft ? [] : perft(opts.quick);
      const r = rules();
      const c = n ? cpuRules(seed) : [];
      const cpu = {};
      if (n) {
        cpu.normalVsEasy = match('normal', 'easy', n, rng, { cfg });
        cpu.easyVsEasy = match('easy', 'easy', Math.max(2, n >> 1), rng, { cfg });
        cpu.randomVsRandom = match('random', 'random', Math.max(2, n >> 1), rng, { cfg });
        if (!opts.noHard) cpu.hardVsNormal = match('hard', 'normal', n, rng, { cfg });
      }
      const all = [...p, ...r, ...c];
      const games = Object.values(cpu);
      const most = (m) => !m || m.wins > m.games / 2 && m.wins >= 2 * m.losses;
      const cpuOk = games.every((m) => m.allLegal && m.allEnded) && most(cpu.normalVsEasy) && most(cpu.hardVsNormal);
      out = {
        ok: all.every((x) => x.ok) && cpuOk,
        perft: `${p.filter((x) => x.ok).length}/${p.length}`, rules: `${r.length + c.length - [...r, ...c].filter((x) => !x.ok).length}/${r.length + c.length}`,
        failed: all.filter((x) => !x.ok), cpu, sabotage: opts.sabotage || null, seconds: +((Date.now() - t0) / 1000).toFixed(1),
        perftDetail: p.map((x) => `${x.name}: ${x.got}${x.ok ? '' : ' (want ' + x.want + ')'} ${x.ms} ms`),
      };
    } finally {
      for (const k of Object.keys(sab)) delete sab[k];
      CH.level('normal', savedNormal);
    }
    return out;
  }

  CH.check = check;
  CH.checkRules = () => rules();
  CH.perftCheck = perft;
  CH.match = (a, b, n = 4, seed = 1, opts) => match(a, b, n, rng32(seed), opts);
  CH.rng32 = rng32;
})();

</script>
<script>
/* TT Chess: Foxy 🦊, the CPU friend. The kit has no fox yet, so this game adds one: a roster entry built on the kit's
   bear head (orange fur, a white muzzle), plus pointy ears with dark tips, a white chin and a bushy tail with a white
   tip. Kit.people.build is wrapped so anything with look.fox gets them, the menu portraits too. Move this into the
   kit if a second game wants Foxy. */
(function () {
  'use strict';
  const T = THREE;
  if (!Kit.roster.get('foxy')) {
    Kit.roster.list.push({
      id: 'foxy',
      name: 'FOXY',
      tag: '#ff8a1f',
      look: {
        head: 'bear', fox: true, skin: '#f07a2a', muzzle: '#fff4e6',
        shirt: 'hoodie', top: '#3fbf8a', print: 'star', bottom: '#2b3a63', shorts: true, shoes: '#ffd400',
      },
    });
  }
  const build = Kit.people.build;
  Kit.people.build = function (look) {
    const p = build(look);
    if (!look || !look.fox) return p;
    const std = Kit.gfx.std;
    const fur = std(look.skin, { roughness: 0.7 }), white = std('#fff4e6', { roughness: 0.7 }), dark = std('#2a1a12', { roughness: 0.7 });
    // hide the bear's round ears (the two boxes sitting on top of the head) and give him pointy ones
    p.head.children.forEach((m) => {
      if (m.position.y > 0.25) m.visible = false;
    });
    for (const sx of [-1, 1]) {
      const ear = new T.Mesh(new T.ConeGeometry(0.12, 0.3, 4), fur);
      ear.position.set(sx * 0.18, 0.36, 0.02);
      ear.rotation.set(0, Math.PI / 4, sx * -0.18);
      p.head.add(ear);
      const tip = new T.Mesh(new T.ConeGeometry(0.06, 0.12, 4), dark);
      tip.position.set(sx * 0.2, 0.47, 0.02);
      tip.rotation.set(0, Math.PI / 4, sx * -0.18);
      p.head.add(tip);
    }
    const chin = new T.Mesh(new T.BoxGeometry(0.36, 0.12, 0.06), white);
    chin.position.set(0, -0.2, -0.23);
    p.head.add(chin);
    // the tail: three puffy segments curling up behind, the last one white
    const tail = new T.Group();
    tail.position.set(0, 0.08, 0.22);
    p.hips.add(tail);
    [[0, 0, 0.12, 0.13, fur], [0, 0.12, 0.3, 0.15, fur], [0, 0.3, 0.42, 0.12, white]].forEach(([x, y, z, r, m]) => {
      const s = new T.Mesh(new T.SphereGeometry(r, 10, 8), m);
      s.position.set(x, y, z);
      s.scale.set(1, 1, 1.4);
      tail.add(s);
    });
    tail.rotation.x = -0.3;
    p.tail = tail;
    return p;
  };
})();

</script>
<script>
/* TT Chess: the game's own sounds, built on Kit.sound.tone / hiss (all synthesised, no files).
   CH.sfx.kit(name, ...args) plays a kit effect; the rest are ours. Every call is a silent no-op until Kit.sound.init()
   has run from the first tap. */
(function () {
  'use strict';
  const CH = (window.CH = window.CH || {});
  const S = Kit.sound;
  const tone = (o) => S.tone(o);
  const hiss = (o) => S.hiss(o);

  const sfx = {
    kit(name, ...args) {
      if (S[name]) S[name](...args);
    },
    // a piece is picked up: a little rising pop, deeper for the big ones
    pick(type = 1) {
      const f = 880 - type * 60;
      tone({ type: 'triangle', f, to: f * 1.5, dur: 0.09, vol: 0.12 });
    },
    // a piece lands on its square: a woody tok
    step(type = 1) {
      const f = 520 - type * 25;
      tone({ type: 'triangle', f, to: f * 0.6, dur: 0.1, vol: 0.15 });
      hiss({ filter: 'lowpass', f: 1600, to: 500, dur: 0.07, vol: 0.06 });
    },
    // the knight's leap: a cartoon boing
    leap() {
      tone({ type: 'sine', f: 220, to: 660, dur: 0.26, vol: 0.13 });
      tone({ type: 'triangle', f: 440, to: 1320, dur: 0.26, vol: 0.05 });
    },
    // a capture: BONK! a hollow knock and a springy wobble down
    bonk() {
      tone({ type: 'square', f: 220, to: 110, dur: 0.12, vol: 0.12, lp: 1400 });
      tone({ type: 'sine', f: 660, to: 330, dur: 0.18, vol: 0.18 });
      tone({ type: 'triangle', f: 520, to: 260, dur: 0.35, vol: 0.08, at: 0.08 });
      hiss({ filter: 'lowpass', f: 2500, to: 300, dur: 0.12, vol: 0.12 });
    },
    // the bonked piece lands on the bench: a little "boing-oing"
    bench() {
      tone({ type: 'sine', f: 500, to: 300, dur: 0.12, vol: 0.07 });
      tone({ type: 'sine', f: 420, to: 260, dur: 0.12, vol: 0.05, at: 0.13 });
    },
    // check: two bright warning notes
    check() {
      tone({ type: 'square', f: 988, dur: 0.1, vol: 0.06, lp: 2600 });
      tone({ type: 'square', f: 1319, dur: 0.16, vol: 0.06, lp: 2600, at: 0.12 });
    },
    // castling: a little fanfare for the king and rook swapping round
    castle() {
      [392, 523, 659].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.08, dur: 0.14, vol: 0.09 }));
    },
    // a pawn becomes a queen (or a rook, bishop or knight): a sparkly run up
    promote() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.06, dur: 0.2, vol: 0.09 }));
      hiss({ filter: 'highpass', f: 6000, at: 0.1, dur: 0.4, vol: 0.05 });
    },
    // the cursor moves
    tick() { tone({ type: 'square', f: 1200, dur: 0.025, vol: 0.025, lp: 3000 }); },
    // can't go there
    nope() {
      tone({ f: 220, dur: 0.08, vol: 0.08 });
      tone({ f: 180, dur: 0.1, vol: 0.08, at: 0.09 });
    },
    // Foxy is thinking: a curious hum
    think() { tone({ type: 'triangle', f: 247, to: 330, dur: 0.3, vol: 0.05 }); },
    // undo: a quick rewind
    undo() {
      [880, 740, 587, 440].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.05, dur: 0.07, vol: 0.08 }));
      hiss({ f: 3000, to: 700, dur: 0.22, vol: 0.04 });
    },
    // a nice move or a star in a lesson: a little rising chime
    nice() { [784, 988, 1319].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.06, dur: 0.18, vol: 0.1 })); },
    star() {
      [1047, 1319, 1568].forEach((f, i) => tone({ type: 'sine', f, at: i * 0.05, dur: 0.2, vol: 0.1 }));
    },
    // your brother's warning: two quick notes
    alert() {
      tone({ type: 'square', f: 988, dur: 0.08, vol: 0.06, lp: 2500 });
      tone({ type: 'square', f: 784, dur: 0.12, vol: 0.06, lp: 2500, at: 0.11 });
    },
    // checkmate for a kid
    win() {
      [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f, at: i * 0.11, dur: 0.16, vol: 0.05, lp: 3000 }));
      [523, 659, 784].forEach((f) => tone({ type: 'triangle', f: f * 2, at: 0.46, dur: 0.6, vol: 0.08 }));
      hiss({ filter: 'highpass', f: 6000, at: 0.46, dur: 0.5, vol: 0.06 });
      [784, 988, 1175, 1568].forEach((f, i) => tone({ type: 'triangle', f, at: 0.9 + i * 0.09, dur: 0.3, vol: 0.09 }));
    },
    // Foxy won: a soft wah-wah, never harsh
    lose() {
      [392, 370, 349, 311].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.22, dur: i === 3 ? 0.5 : 0.22, vol: 0.09 }));
    },
    draw() {
      tone({ type: 'triangle', f: 523, dur: 0.14, vol: 0.09 });
      tone({ type: 'triangle', f: 523, dur: 0.22, vol: 0.09, at: 0.16 });
    },
    // your brother pops in (and out)
    pop() {
      tone({ f: 300, to: 900, dur: 0.12, vol: 0.1 });
      hiss({ f: 2000, to: 6000, dur: 0.15, vol: 0.05 });
    },
    // the high five: a clap
    clap() {
      hiss({ filter: 'bandpass', f: 1500, q: 0.8, dur: 0.09, vol: 0.22 });
      hiss({ filter: 'highpass', f: 3000, dur: 0.05, vol: 0.1, at: 0.01 });
    },
  };

  CH.sfx = sfx;
})();

</script>
<script>
/* TT Chess: effects, from Tommy's Toy Box (by way of TT Tic-Tac-Toe).
   CH.fx.flyers(scene): emoji sprites that fly, spin and fade in a 3D scene (stars, 💥, ✌️, treats).
   CH.fx.bursts(scene): comic "BONK!" / "SPLASH!" starbursts that pop and fade.
   CH.fx.overlay: confetti and emoji on the 2D canvas over the page, in screen pixels (confetti for a win). */
(function () {
  'use strict';
  const T = THREE;
  const CH = (window.CH = window.CH || {});
  const { makeCanvas, toTexture, emojiTexture, rand, pick, FONT } = Kit.gfx;

  // ---------------------------------------------------------------- 3D emoji flyers

  function flyers(scene, max = 48) {
    const pool = [];
    for (let i = 0; i < max; i++) {
      const s = new T.Sprite(new T.SpriteMaterial({ depthWrite: false, depthTest: false, transparent: true }));
      s.visible = false;
      s.renderOrder = 20;
      scene.add(s);
      pool.push({ s, life: 0, age: 0, vx: 0, vy: 0, vz: 0, spin: 0, g: 0, size: 1 });
    }
    let next = 0;
    return {
      // emoji at (x, y, z), velocity (vx, vy) in m/s, size in m, life in s, spin in rad/s, gravity in m/s²
      add(emoji, x, y, z, vx, vy, size, life, spin = 0, g = 6, vz = 0) {
        const f = pool[next];
        next = (next + 1) % max;
        f.s.material.map = emojiTexture(emoji);
        f.s.material.needsUpdate = true;
        f.s.material.rotation = 0;
        f.s.position.set(x, y, z);
        f.s.scale.setScalar(size);
        f.s.visible = true;
        Object.assign(f, { life, age: 0, vx, vy, vz, spin, g, size });
        return f;
      },
      update(dt) {
        for (const f of pool) {
          if (!f.s.visible) continue;
          f.age += dt;
          if (f.age >= f.life) {
            f.s.visible = false;
            continue;
          }
          f.vy -= f.g * dt;
          f.s.position.x += f.vx * dt;
          f.s.position.y += f.vy * dt;
          f.s.position.z += f.vz * dt;
          f.s.material.rotation += f.spin * dt;
          const u = f.age / f.life;
          const pop = Math.min(1, f.age / 0.12);
          f.s.scale.setScalar(f.size * (0.5 + 0.5 * pop));
          f.s.material.opacity = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
        }
      },
      clear() {
        for (const f of pool) f.s.visible = false;
      },
    };
  }

  // ---------------------------------------------------------------- comic starbursts

  const burstCache = {};
  // The word is translated when drawn (BONK! is 咚！ in 中文), and cached per language.
  function burstTexture(en, fill = '#ffd400', ink = '#e8372c') {
    const word = Kit.lang ? Kit.lang.t(en) : en;
    const key = word + fill + ink;
    if (burstCache[key]) return burstCache[key];
    const [c, g] = makeCanvas(256, 256);
    const spikes = 12;
    g.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 ? 78 : 122 - (i % 4 === 0 ? 0 : 10);
      g.lineTo(128 + Math.cos(a) * r, 128 + Math.sin(a) * r);
    }
    g.closePath();
    g.fillStyle = fill;
    g.fill();
    g.lineWidth = 9;
    g.strokeStyle = ink;
    g.lineJoin = 'round';
    g.stroke();
    let size = word.length > 4 ? 46 : 56;
    g.font = `${size}px ${FONT}`;
    const w = g.measureText(word).width;
    if (w > 190) g.font = `${Math.floor((size * 190) / w)}px ${FONT}`; // keep it inside the star
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.lineWidth = 10;
    g.strokeStyle = '#14121f';
    g.strokeText(word, 128, 134);
    g.fillStyle = '#ffffff';
    g.fillText(word, 128, 134);
    return (burstCache[key] = toTexture(c));
  }

  function bursts(scene, max = 6) {
    const pool = [];
    for (let i = 0; i < max; i++) {
      const s = new T.Sprite(new T.SpriteMaterial({ depthWrite: false, depthTest: false, transparent: true }));
      s.visible = false;
      s.renderOrder = 21;
      scene.add(s);
      pool.push({ s, age: 0, size: 1, life: 0.6 });
    }
    let next = 0;
    return {
      add(word, x, y, z, size = 1.6, fill, ink) {
        const b = pool[next];
        next = (next + 1) % max;
        b.s.material.map = burstTexture(word, fill, ink);
        b.s.material.needsUpdate = true;
        b.s.material.rotation = rand(-0.3, 0.3);
        b.s.position.set(x, y, z);
        b.s.visible = true;
        Object.assign(b, { age: 0, size, life: 0.62 });
      },
      update(dt) {
        for (const b of pool) {
          if (!b.s.visible) continue;
          b.age += dt;
          const u = b.age / b.life;
          if (u >= 1) {
            b.s.visible = false;
            continue;
          }
          const pop = u < 0.2 ? (u / 0.2) * 1.25 : 1.25 - Math.min(0.25, (u - 0.2) * 1.2);
          b.s.scale.setScalar(b.size * pop);
          b.s.position.y += dt * 0.6;
          b.s.material.opacity = u > 0.65 ? 1 - (u - 0.65) / 0.35 : 1;
        }
      },
      clear() {
        for (const b of pool) b.s.visible = false;
      },
    };
  }

  // ---------------------------------------------------------------- 2D overlay: confetti and emoji in screen pixels

  const overlay = (function () {
    let cv = null, g = null, dpr = 1;
    const parts = [];
    const COLORS = ['#ffd400', '#ff3d7f', '#18d4ff', '#3fe0b0', '#ff8a1f', '#a77bff'];
    function init(canvas) {
      cv = canvas;
      g = cv.getContext('2d');
      resize();
    }
    function resize() {
      if (!cv) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, Math.round(innerWidth * dpr));
      cv.height = Math.max(1, Math.round(innerHeight * dpr));
    }
    // a burst of confetti (and optionally emoji) at screen point (x, y)
    function burst(x, y, n = 24, emojis = null, power = 1) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(180, 520) * power;
        const emo = emojis && Math.random() < 0.4 ? pick(emojis) : null;
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 260 * power, life: rand(0.9, 1.5), age: 0,
          rot: rand(0, 6), vr: rand(-10, 10), w: rand(8, 15), h: rand(5, 9), color: pick(COLORS), emo, size: rand(26, 40),
        });
      }
      while (parts.length > 400) parts.shift();
    }
    // confetti raining down from the top edge
    function rain(n = 80) {
      for (let i = 0; i < n; i++) {
        parts.push({
          x: rand(0, innerWidth), y: rand(-200, -10), vx: rand(-60, 60), vy: rand(80, 260), life: rand(2, 3.2), age: 0,
          rot: rand(0, 6), vr: rand(-8, 8), w: rand(8, 15), h: rand(5, 9), color: pick(COLORS), emo: null, size: 0,
        });
      }
    }
    function update(dt) {
      if (!g) return;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += dt;
        if (p.age >= p.life) {
          parts.splice(i, 1);
          continue;
        }
        p.vy += 700 * dt;
        p.vx *= 1 - 1.6 * dt;
        p.vy *= 1 - 0.9 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        const u = p.age / p.life;
        g.globalAlpha = u > 0.75 ? 1 - (u - 0.75) / 0.25 : 1;
        g.save();
        g.translate(p.x, p.y);
        g.rotate(p.rot);
        if (p.emo) {
          g.font = `${p.size}px ${Kit.gfx.EMOJI_FONT}`;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillText(p.emo, 0, 0);
        } else {
          g.fillStyle = p.color;
          g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 1.7)) + 1);
        }
        g.restore();
      }
      g.globalAlpha = 1;
    }
    const clear = () => { parts.length = 0; };
    return { init, resize, burst, rain, update, clear, get count() { return parts.length; } };
  })();

  CH.fx = { flyers, bursts, burstTexture, overlay };
})();
