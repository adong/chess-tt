<!doctype html>
<html lang="en">

<title>TT Chess · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23b48cff'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%E2%99%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('♟️', '#b48cff');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffd400;
    --pink: #ff3d7f;
    --cyan: #18d4ff;
    --mint: #3fe0b0;
    --green: #7ed957;
    --blue: #2f7cf0;
    --orange: #ff8a1f;
    --purple: #a77bff;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    --pad: max(12px, env(safe-area-inset-left));
    /* the kit's ? and language buttons (js/keys.js): the middle of the left edge, but on a tall screen in a game or a
       lesson the bottom left corner, so the board can use the whole width (as in TT Gomoku) */
    --kh-top: calc(50% - 20px);
    --kl-top: calc(50% + 28px);
    --ks-top: calc(50% + 76px);
  }
  @media (max-aspect-ratio: 115/100) {
    body[data-screen="play"], body[data-screen="lesson"] { --kh-top: calc(100% - 104px - env(safe-area-inset-bottom)); --kl-top: calc(100% - 56px - env(safe-area-inset-bottom)); --ks-top: calc(100% - 152px - env(safe-area-inset-bottom)); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #a8e6ff; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; z-index: 8; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  img { -webkit-user-drag: none; }

  /* ---------- big chunky buttons ---------- */
  .bigbtn {
    min-width: clamp(78px, 13vmin, 112px); height: clamp(78px, 13vmin, 112px); border-radius: 28px; padding: 0 18px;
    font-size: clamp(40px, 7vmin, 58px); line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #ffffff, #e9e3ff); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #8ef56b, #2dbf4e); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn .word { font-family: var(--display); font-size: clamp(22px, 4.4vmin, 36px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); color: #fff; }
  .bigbtn:active, .tile:active, .seg button:active, .ibtn:active, .tbtn:active, .pbtn:active, .lcard:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: clamp(52px, 8vmin, 72px); height: clamp(52px, 8vmin, 72px); border-radius: 20px; font-size: clamp(26px, 4.4vmin, 36px); line-height: 1;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink); color: var(--ink);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2.2vh, 20px); transition: opacity 0.3s; padding: 12px; }
  @media (min-aspect-ratio: 115/100) { #home { left: 46vw; right: max(10px, env(safe-area-inset-right)); top: 0; bottom: 0; } }
  @media (max-aspect-ratio: 115/100) { #home { left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); height: 60vh; justify-content: flex-start; padding-left: 62px; padding-right: 12px; } }
  .logo { text-align: center; font-family: var(--display); line-height: 0.92; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(26px, 5vmin, 44px); color: var(--cyan); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(44px, 10vmin, 96px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 12px 24px rgba(0,0,0,.2); letter-spacing: 1px; white-space: nowrap; }
  .tiles { display: flex; gap: clamp(12px, 3vmin, 28px); }
  .tile {
    position: relative; width: clamp(140px, 25vmin, 250px); aspect-ratio: 1 / 0.86; border-radius: 32px; border: 6px solid #fff;
    box-shadow: 0 9px 0 var(--ink); overflow: hidden; transition: transform 0.08s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%; padding-top: 6%;
  }
  .tile:hover { transform: translateY(-3px) rotate(-1deg); }
  .tile.play { background: radial-gradient(circle at 50% 35%, #e4ffd0, #6cc04a); }
  .tile.learn { background: radial-gradient(circle at 50% 35%, #f3e9ff, #b48cff); }
  .tile b { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 3.4vmin, 32px); line-height: 1.05; text-align: center; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); padding: 0 6px; }
  .tile .go { position: absolute; right: 5px; top: 5px; width: 21%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(160deg, #8ef56b, #2dbf4e); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; font-size: clamp(18px, 3.6vmin, 32px); }
  .tile .pics { display: flex; align-items: flex-end; justify-content: center; height: 46%; }
  .tile .pics img { height: 100%; aspect-ratio: 1; margin: 0 -9%; }
  .opts { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .seg button {
    display: flex; align-items: center; gap: 8px; height: clamp(50px, 8.2vmin, 70px); padding: 0 16px 0 10px; border-radius: 22px; border: 4px solid #fff;
    background: rgba(255, 255, 255, 0.55); box-shadow: 0 5px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(14px, 2.7vmin, 23px); transition: transform 0.12s;
  }
  .seg button img { height: 80%; aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .seg button .emo { font-size: 1.3em; }
  .seg button .dot { width: 0.8em; height: 0.8em; border-radius: 50%; border: 3px solid var(--ink); }
  .seg button.on { background: linear-gradient(160deg, #fffbe0, #ffd84a); border-color: var(--yellow); box-shadow: 0 0 0 4px var(--ink), 0 6px 0 4px var(--ink); transform: scale(1.06); }
  .duo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(16px, 3vmin, 26px); color: var(--ink); background: rgba(255,255,255,.55); border: 4px solid #fff; border-radius: 22px; padding: 4px 14px 4px 6px; box-shadow: 0 5px 0 var(--ink); }
  .duo img { width: clamp(44px, 7vmin, 62px); aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .duo .dot { width: 0.9em; height: 0.9em; border-radius: 50%; border: 3px solid var(--ink); }
  .duo .vs { color: var(--pink); }
  @media (max-height: 430px) {
    /* a phone on its side: the menu a size smaller so it all fits */
    #home { gap: 5px; padding: 4px; }
    .logo small { font-size: 17px; -webkit-text-stroke-width: 2px; }
    .logo big { font-size: 34px; text-shadow: 0 4px 0 var(--ink); }
    .tile { width: 112px; border-width: 4px; border-radius: 22px; }
    .tile b { font-size: 14px; }
    .tile .go { display: none; } /* the whole tile is the button; no room for the ▶ here */
    .seg button { height: 38px; font-size: 12px; border-radius: 15px; padding: 0 8px 0 6px; border-width: 3px; gap: 4px; }
    .opts { gap: 5px; }
    .duo { display: none !important; }
    .logo big { font-size: 30px; }
  }
  @media (max-width: 430px) and (max-aspect-ratio: 115/100) {
    /* a phone held upright: a smaller menu so it all fits under the board (the faces line is left out) */
    #home { gap: 8px; height: 62vh; }
    .logo small { font-size: 22px; }
    .logo big { font-size: 40px; }
    .tile { width: 128px; border-radius: 26px; }
    .opts { gap: 8px; }
    .seg button { padding: 0 9px 0 6px; gap: 4px; font-size: 13px; height: 46px; border-radius: 18px; }
    .duo { display: none !important; }
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  .hudtop { position: absolute; left: var(--pad); right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .hudtop > button { pointer-events: auto; flex-shrink: 0; }
  .hudmid { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; margin-left: var(--toolsw, 0px); }
  .score { display: flex; align-items: center; gap: clamp(6px, 1.4vmin, 12px); padding: 5px 8px; border-radius: 999px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; }
  .score .side { display: flex; align-items: center; gap: clamp(4px, 1vmin, 8px); border-radius: 999px; padding: 2px; transition: box-shadow 0.2s, background 0.2s; }
  .score .side.now { background: rgba(255, 212, 0, 0.35); box-shadow: 0 0 0 3px var(--yellow); }
  .score img { width: clamp(38px, 6.5vmin, 56px); height: clamp(38px, 6.5vmin, 56px); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 4px solid var(--blue); }
  .score img.o { border-color: var(--orange); }
  .score b { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vmin, 42px); line-height: 1; color: var(--yellow); min-width: 1ch; text-align: center; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
  .score b.bump { animation: bump 0.4s cubic-bezier(.3, 1.8, .5, 1); }
  .score .dash { font-family: var(--display); color: #fff; font-size: clamp(18px, 3vmin, 26px); }
  @keyframes bump { 40% { transform: scale(1.4) rotate(-6deg); } }
  .turn { font-family: var(--display); font-size: clamp(18px, 3.6vmin, 30px); color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); white-space: nowrap; transition: opacity 0.2s; }
  .turn.mine { color: var(--yellow); animation: nudge 1.2s ease-in-out infinite; }
  .hudmid { position: relative; }
  .hudmid .pill { position: absolute; top: calc(100% + 4px); }
  .pill { font-family: var(--display); font-size: clamp(14px, 2.6vmin, 20px); color: #fff; padding: 2px 12px; border-radius: 999px; background: rgba(232, 55, 44, 0.92); border: 3px solid #fff; animation: nudge 0.9s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.08); } }
  @media (max-width: 520px) {
    .score img { width: 36px; height: 36px; border-width: 3px; }
    .turn { font-size: 17px; }
  }
  @media (max-height: 520px) {
    .hudmid { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
    .score img { width: 32px; height: 32px; border-width: 3px; }
    .score b { font-size: 22px; }
    .turn { font-size: 15px; }
    .pill { font-size: 13px; }
  }

  /* a phone on its side: two columns so the board gets the whole height. Pause, undo and flip go down the left (above
     the kit's ? and language buttons); sound, the score and whose turn go down the right (above your brother) */
  @media (max-height: 430px) and (min-aspect-ratio: 115/100) {
    #pauseBtn { position: fixed; left: var(--pad); top: 8px; }
    .hudtop { left: auto; right: max(8px, env(safe-area-inset-right)); top: 8px; width: 112px; flex-direction: column; align-items: flex-end; gap: 6px; }
    #muteBtn { order: -1; }
    .hudmid { margin-left: 0; flex-direction: column; align-items: flex-end; flex: none; width: 112px; gap: 4px; }
    .score { flex-direction: column; align-items: flex-end; gap: 2px; padding: 4px 6px; border-radius: 18px; }
    .score .dash { display: none; }
    #sideR { flex-direction: row-reverse; }
    .turn { white-space: normal; text-align: right; font-size: 13px; line-height: 1.15; -webkit-text-stroke-width: 2px; }
    .turn.mine { animation: none; }
    .pill { font-size: 12px; }
    .hudmid .pill { position: static; }
  }
  /* undo and flip: bottom left on a tall screen, next to pause on a wide one */
  .tools { position: fixed; z-index: 7; display: flex; gap: 10px; pointer-events: none; }
  .tools > * { pointer-events: auto; }
  @media (max-aspect-ratio: 115/100) { .tools { left: calc(var(--pad) + 46px); bottom: max(14px, env(safe-area-inset-bottom)); } }
  @media (min-aspect-ratio: 115/100) { .tools { left: calc(var(--pad) + clamp(52px, 8vmin, 72px) + 12px); top: max(10px, env(safe-area-inset-top)); } }
  .tbtn {
    height: clamp(52px, 8vmin, 72px); min-width: clamp(52px, 8vmin, 72px); border-radius: 20px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 4px;
    background: rgba(255, 255, 255, 0.92); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink); color: var(--ink); font-size: clamp(24px, 4vmin, 34px); line-height: 1;
  }
  .tbtn:disabled { opacity: 0.45; }
  .tbtn.off { display: none; }
  @media (max-height: 430px) { .tbtn, .ibtn { height: 44px; min-width: 44px; width: auto; font-size: 21px; border-radius: 14px; border-width: 3px; } .ibtn { width: 44px; } }
  @media (max-height: 430px) and (min-aspect-ratio: 115/100) { .tools { left: var(--pad); top: 58px; flex-direction: column; gap: 6px; } .tbtn { height: 42px; } }

  /* your brother's button (1 player) / the high five (2 players): bottom right, big */
  .callbtn {
    position: fixed; z-index: 7; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(84px, 14vmin, 124px); aspect-ratio: 1; border-radius: 50%; padding: 6px;
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink);
    display: grid; place-items: center; font-size: clamp(44px, 8vmin, 64px); line-height: 1;
  }
  .callbtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .callbtn kbd { position: absolute; left: -6px; top: -6px; width: 34px; height: 34px; border-radius: 10px; background: #fff; color: var(--ink); font: 400 18px/30px var(--display); text-align: center; border: 3px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .callbtn kbd { display: none; } }
  .callbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .callbtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 7px 0 var(--ink); } }
  @media (max-height: 430px) { .callbtn { width: 66px; border-width: 4px; padding: 4px; } }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 96vw; }
  .toast {
    font-family: var(--display); font-size: clamp(22px, 4.6vmin, 42px); color: var(--yellow); max-width: 94vw; text-align: center;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 1.9s ease-out forwards;
  }
  .toast.save { color: #7df7c8; font-size: clamp(22px, 5vmin, 46px); animation-duration: 3.2s; }
  .toast.warn { color: #ff8f8f; }
  .toast.treat { color: #fff; }
  .toast.buddy { color: #ffb02e; }
  .toast.hint { color: #fff; font-size: clamp(18px, 3.6vmin, 30px); }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }

  /* ---------- overlays: game over, pause, promotion, LEARN ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; padding: 14px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.2vh, 20px); padding: clamp(16px, 3.4vmin, 32px); border-radius: 40px; background: linear-gradient(170deg, #f4ffe6, #d6f5b8); border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); color: var(--ink); max-width: 96vw; max-height: 96vh; }
  .rface { display: flex; align-items: center; gap: 14px; }
  .rface img { width: clamp(70px, 14vmin, 120px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 5px solid var(--blue); box-shadow: 0 4px 0 var(--ink); animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  .rface img.o { border-color: var(--orange); }
  .rface .big { font-size: clamp(56px, 12vmin, 100px); line-height: 1; animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { from { transform: scale(0.3); } }
  .rtitle { font-family: var(--display); font-size: clamp(30px, 6.6vmin, 60px); line-height: 1.05; text-align: center; color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); max-width: 88vw; }
  .rsub { font-family: var(--display); font-size: clamp(16px, 3.2vmin, 26px); text-align: center; color: var(--ink); }
  .rscore { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: clamp(28px, 5.6vmin, 48px); }
  .rscore img { width: 1.3em; height: 1.3em; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 3px solid var(--blue); }
  .rscore img.o { border-color: var(--orange); }
  .rscore .dash { color: #8a9a7a; }
  .rbtns { display: flex; gap: clamp(14px, 3vmin, 26px); align-items: center; flex-wrap: wrap; justify-content: center; }
  #pause .panel { flex-direction: row; gap: 20px; flex-wrap: wrap; justify-content: center; }
  @media (max-height: 430px) { .panel { gap: 8px; padding: 12px 20px; } .rface img { width: 60px; } .rface .big { font-size: 48px; } .bigbtn { height: 62px; min-width: 62px; font-size: 30px; border-radius: 20px; } .rtitle { font-size: 28px; } .rscore { font-size: 26px; } }

  /* the promotion picker: four big pieces */
  #promo .panel { background: linear-gradient(170deg, #fffbe9, #ffe6b0); }
  .pbtns { display: flex; gap: clamp(8px, 2vmin, 18px); flex-wrap: wrap; justify-content: center; }
  .pbtn { position: relative; width: clamp(84px, 17vmin, 150px); aspect-ratio: 1; border-radius: 26px; background: #fff; border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6%; }
  .pbtn img { position: absolute; inset: 4% 8% 22%; width: 84%; height: 74%; object-fit: contain; }
  .pbtn b { position: relative; font-family: var(--display); font-weight: 400; font-size: clamp(12px, 2.3vmin, 18px); }
  .pbtn kbd { position: absolute; left: -6px; top: -6px; width: 28px; height: 28px; border-radius: 9px; background: var(--yellow); color: var(--ink); font: 400 15px/24px var(--display); text-align: center; border: 3px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .pbtn kbd { display: none; } }

  /* LEARN: the lesson cards */
  #learn .panel { width: min(900px, 96vw); background: linear-gradient(170deg, #f8f2ff, #e2d3ff); overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  #learn .rtitle { font-size: clamp(28px, 5.6vmin, 50px); }
  .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 42vw), 1fr)); gap: clamp(8px, 1.6vmin, 14px); width: 100%; }
  .lcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px 10px; border-radius: 22px; background: #fff; border: 4px solid var(--ink); box-shadow: 0 5px 0 rgba(20,18,31,.35); color: var(--ink); }
  .lcard.ch { background: #fff5c2; }
  .lcard img { width: 62%; aspect-ratio: 1; object-fit: contain; }
  .lcard .emo { font-size: clamp(40px, 8vmin, 64px); line-height: 1.3; }
  .lcard b { font-family: var(--display); font-weight: 400; font-size: clamp(13px, 2.3vmin, 18px); line-height: 1.1; text-align: center; }
  .lcard .ok { position: absolute; right: 6px; top: 4px; font-size: 26px; }
  .lrow { display: flex; gap: 14px; align-items: center; }

  /* a lesson: the bar on top and the intro card */
  #lessonBar { position: fixed; z-index: 6; left: calc(var(--pad) + 50px); right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; transition: opacity 0.3s; }
  #lessonBar > * { pointer-events: auto; }
  .lbtns { display: flex; gap: 8px; }
  .lmid { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 16px 6px 8px; border-radius: 26px; background: rgba(255,255,255,.88); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink); color: var(--ink); max-width: 720px; margin: 0 auto; }
  .lmid img { width: clamp(44px, 8vmin, 70px); aspect-ratio: 1; flex-shrink: 0; }
  .lmid .lt { display: flex; flex-direction: column; min-width: 0; }
  .lmid b { font-family: var(--display); font-weight: 400; font-size: clamp(15px, 3vmin, 26px); line-height: 1.1; }
  .lmid span { font-weight: 800; font-size: clamp(13px, 2.4vmin, 19px); line-height: 1.2; }
  .lmid .lstars { font-family: var(--display); font-size: clamp(16px, 3vmin, 24px); white-space: nowrap; margin-left: auto; padding-left: 8px; }
  @media (max-aspect-ratio: 115/100) { #lessonBar { flex-wrap: wrap; } .lmid { order: 3; flex-basis: 100%; } }
  @media (max-height: 430px) { .lmid { padding: 3px 10px 3px 4px; } .lmid img { width: 38px; } .lmid b { font-size: 14px; } .lmid span { font-size: 12px; } }

  #intro .panel, #lessonDone .panel { background: linear-gradient(170deg, #f8f2ff, #e2d3ff); max-width: min(620px, 96vw); }
  .ipic { display: flex; align-items: center; gap: clamp(10px, 3vmin, 26px); }
  .ipic > img { width: clamp(90px, 20vmin, 170px); aspect-ratio: 1; }
  .ipic .emo { font-size: clamp(70px, 15vmin, 130px); line-height: 1; }
  .diag { display: grid; grid-template-columns: repeat(7, 1fr); width: clamp(140px, 30vmin, 230px); aspect-ratio: 1; border: 4px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .diag i { position: relative; display: grid; place-items: center; background: #fff5d6; font-style: normal; }
  .diag i.d { background: #74c45a; }
  .diag i.on::after { content: ''; width: 44%; height: 44%; border-radius: 50%; background: #3bff7a; border: 2px solid var(--ink); }
  .diag i.x::after { content: ''; width: 66%; height: 66%; border-radius: 50%; border: 4px solid #ff3d3d; }
  .diag i.two::after { opacity: 0.55; }
  .diag i img { width: 150%; height: 150%; object-fit: contain; margin-top: -30%; }
  .isay { font-family: var(--display); font-size: clamp(18px, 3.8vmin, 32px); text-align: center; line-height: 1.15; }
  .done-stars { font-size: clamp(44px, 10vmin, 84px); letter-spacing: 6px; }
  @media (max-height: 430px) { .diag { width: 120px; } .ipic > img { width: 80px; } .isay { font-size: 17px; } .done-stars { font-size: 38px; } }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #a8e6ff; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bump 0.8s infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .turn.mine, .callbtn.here, .pill { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tiles">
    <button class="tile play" id="goPlay" title="Play (Enter)" aria-label="Play">
      <span class="pics"><img id="picPlayA" alt="" draggable="false"><img id="picPlayB" alt="" draggable="false"></span>
      <b>PLAY</b><span class="go">▶</span>
    </button>
    <button class="tile learn" id="goLearn" title="Learn (L)" aria-label="Learn">
      <span class="pics"><img id="picLearn" alt="" draggable="false"></span>
      <b>LEARN</b>
    </button>
  </div>
  <div class="opts">
    <div class="seg" id="segPlayers" role="radiogroup" aria-label="Players">
      <button data-v="1"><span class="emo">👤</span>1 PLAYER</button>
      <button data-v="2"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" role="radiogroup" aria-label="Who are you?">
      <button data-v="teddy"><img alt="" draggable="false">TEDDY<i class="dot" style="background: var(--blue)"></i></button>
      <button data-v="tommy"><img alt="" draggable="false">TOMMY<i class="dot" style="background: var(--orange)"></i></button>
    </div>
    <div class="seg" id="segLevel" role="radiogroup" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL</button>
      <button data-v="hard"><span class="emo">🧠</span>HARD</button>
    </div>
    <div class="duo" id="duo"><img id="duoA" alt="" draggable="false"><i class="dot" id="duoDotA"></i><span class="vs">·</span><i class="dot" id="duoDotB"></i><img id="duoB" alt="" draggable="false"></div>
    <div class="seg" id="segUndo" role="radiogroup" aria-label="Undo button">
      <button data-v="on"><span class="emo">↩️</span>UNDO ON</button>
      <button data-v="off"><span class="emo">🚫</span>UNDO OFF</button>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <div class="hudmid">
      <div class="score">
        <div class="side" id="sideL"><img id="faceL" alt=""><b id="scoreL">0</b></div>
        <span class="dash">–</span>
        <div class="side" id="sideR"><b id="scoreR">0</b><img id="faceR" alt=""></div>
      </div>
      <div class="turn" id="turn"></div>
      <div class="pill hidden" id="checkPill">CHECK!</div>
    </div>
    <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  </div>
</div>
<div class="tools hidden" id="tools">
  <button class="tbtn" id="undoBtn" title="Undo (U)" aria-label="Undo">↩️</button>
  <button class="tbtn" id="flipBtn" title="Turn the board round (F)" aria-label="Turn the board round">🔃</button>
</div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother"><img id="callFace" alt=""><kbd>T</kbd></button>

<!-- a lesson: what to do, the stars, back and again -->
<div id="lessonBar" class="hidden">
  <div class="lbtns">
    <button class="ibtn" id="lBack" title="All the lessons (Esc)" aria-label="All the lessons">📚</button>
    <button class="ibtn" id="lAgain" title="Start again (R)" aria-label="Start again">🔄</button>
  </div>
  <div class="lmid"><img id="lPic" alt=""><div class="lt"><b id="lTitle"></b><span id="lSay"></span></div><div class="lstars" id="lStars"></div></div>
  <button class="ibtn" id="lMute" title="Sound (M)" aria-label="Sound on or off">🔊</button>
</div>

<div id="toasts"></div>

<!-- the game is over -->
<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="oFace"></div>
    <div class="rtitle" id="oTitle"></div>
    <div class="rsub" id="oWhy"></div>
    <div class="rscore" id="oScore"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="oAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="oHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start a new game">🔄</button>
    <button class="bigbtn" id="pLearn" aria-label="Learn">🎓</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<!-- promotion: which piece does the pawn become? -->
<div id="promo" class="overlay hidden">
  <div class="panel">
    <div class="rtitle">WHAT WILL IT BE?</div>
    <div class="pbtns" id="pbtns">
      <button class="pbtn" data-t="5" aria-label="Queen"><img alt=""><b>QUEEN</b><kbd>1</kbd></button>
      <button class="pbtn" data-t="4" aria-label="Rook"><img alt=""><b>ROOK</b><kbd>2</kbd></button>
      <button class="pbtn" data-t="3" aria-label="Bishop"><img alt=""><b>BISHOP</b><kbd>3</kbd></button>
      <button class="pbtn" data-t="2" aria-label="Knight"><img alt=""><b>KNIGHT</b><kbd>4</kbd></button>
    </div>
  </div>
</div>

<!-- LEARN: the lessons -->
<div id="learn" class="overlay hidden">
  <div class="panel">
    <div class="lrow"><button class="ibtn" id="learnHome" title="Home (Esc)" aria-label="Home">🏠</button><div class="rtitle">LEARN</div></div>
    <div class="lgrid" id="lgrid"></div>
  </div>
</div>

<!-- a lesson's picture card -->
<div id="intro" class="overlay hidden">
  <div class="panel">
    <div class="rtitle" id="iTitle"></div>
    <div class="ipic" id="iPic"></div>
    <div class="isay" id="iSay"></div>
    <button class="bigbtn go" id="iGo" aria-label="Go!">▶</button>
  </div>
</div>

<!-- a lesson is done -->
<div id="lessonDone" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="dFace"></div>
    <div class="rtitle" id="dTitle">GREAT JOB!</div>
    <div class="done-stars" id="dStars"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="dNext" aria-label="Next lesson">▶</button>
      <button class="bigbtn" id="dAgain" aria-label="Start again">🔄</button>
      <button class="bigbtn" id="dBack" aria-label="All the lessons">📚</button>
    </div>
  </div>
</div>

<div id="loading"><span>♟️</span></div>

<script>
