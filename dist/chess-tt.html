<script>
/* Claude Games kit: canvas, texture and material helpers shared by every game.
   Load after three.min.js. Exposes window.Kit.gfx. Turns on THREE.ColorManagement, so games should set
   renderer.outputEncoding = THREE.sRGBEncoding. */
(function () {
  'use strict';
  const T = THREE;
  if (T.ColorManagement && 'legacyMode' in T.ColorManagement) T.ColorManagement.legacyMode = false;
  const Kit = (window.Kit = window.Kit || {});

  const FONT = '"Bungee", "Arial Black", Impact, sans-serif';
  const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';

  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return [c, c.getContext('2d')];
  }

  function toTexture(c, repeat) {
    const t = new T.CanvasTexture(c);
    t.encoding = T.sRGBEncoding;
    t.anisotropy = 8;
    if (repeat) t.wrapS = t.wrapT = T.RepeatWrapping;
    return t;
  }

  // Mix a #rrggbb colour toward white (amt > 0) or black (amt < 0).
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16), to = amt < 0 ? 0 : 255, k = Math.abs(amt);
    const ch = (v) => Math.round(v + (to - v) * k);
    return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  const std = (color, o) => new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.8, metalness: 0 }, o));

  function mesh(geo, mat, x, y, z, parent, shadow = true) {
    const m = new T.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = shadow;
    parent.add(m);
    return m;
  }

  // Scale a box's UVs so a repeating texture keeps the same size on boxes of any size (one tile per `unit`).
  function boxUV(geo, X, Y, Z, unit) {
    const uv = geo.attributes.uv;
    const faces = [[Z, Y], [Z, Y], [X, Z], [X, Z], [X, Y], [X, Y]]; // px nx py ny pz nz
    for (let f = 0; f < 6; f++) {
      for (let i = 0; i < 4; i++) {
        const k = f * 4 + i;
        uv.setXY(k, (uv.getX(k) * faces[f][0]) / unit, (uv.getY(k) * faces[f][1]) / unit);
      }
    }
  }

  function radialTexture(size, stops) {
    const [c, g] = makeCanvas(size, size);
    const h = size / 2;
    const gr = g.createRadialGradient(h, h, 0, h, h, h);
    stops.forEach(([o, col]) => gr.addColorStop(o, col));
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    return toTexture(c);
  }

  // Soft white glow (for additive sprites) and a round particle dot. Made once, on first use.
  let glow = null, dot = null;
  const glowTexture = () => glow || (glow = radialTexture(128, [[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,255,255,0.6)'], [1, 'rgba(255,255,255,0)']]));
  const dotTexture = () => dot || (dot = radialTexture(64, [[0, 'rgba(255,255,255,1)'], [0.45, 'rgba(255,255,255,0.85)'], [1, 'rgba(255,255,255,0)']]));

  const emojiCache = {};
  function emojiTexture(emoji) {
    if (emojiCache[emoji]) return emojiCache[emoji];
    const [c, g] = makeCanvas(128, 128);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = `100px ${EMOJI_FONT}`;
    g.fillText(emoji, 64, 70);
    return (emojiCache[emoji] = toTexture(c));
  }

  // A pill-shaped name label sprite, about 1.3 m wide. Put it above a character's head.
  function nameTag(text, color) {
    const [c, g] = makeCanvas(256, 80);
    g.fillStyle = color;
    roundRect(g, 6, 6, 244, 68, 34);
    g.fill();
    g.lineWidth = 6;
    g.strokeStyle = '#14121f';
    g.stroke();
    g.font = `40px ${FONT}`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#14121f';
    g.fillText(text, 128, 44);
    const s = new T.Sprite(new T.SpriteMaterial({ map: toTexture(c), depthWrite: false }));
    s.scale.set(1.3, 0.41, 1);
    return s;
  }

  Kit.gfx = {
    FONT, EMOJI_FONT, rand, randi, pick,
    makeCanvas, toTexture, shade, roundRect, std, mesh, boxUV, radialTexture,
    glowTexture, dotTexture, emojiTexture, nameTag,
  };
})();

</script>
<script>
/* Claude Games kit: blocky cartoon people built from boxes, and the poses that animate them.
   Load after gfx.js. Exposes window.Kit.people: build(look), pose(p, phase, mode, k), handWorld(p, side). */
(function () {
  'use strict';
  const T = THREE;
  const Kit = window.Kit;
  const { makeCanvas, toTexture, shade, roundRect, std, mesh } = Kit.gfx;

  // Shirt prints, painted on the front of the torso.
  const printCache = {};
  function printTexture(kind, base, skin) {
    const key = kind + base + skin;
    if (printCache[key]) return printCache[key];
    const [c, g] = makeCanvas(128, 128);
    g.fillStyle = base;
    g.fillRect(0, 0, 128, 128);
    if (kind === 'bricks') {
      // a brick wall, a row of brown blocks, and a little winged buddy peeking over the wall
      g.strokeStyle = shade(base, -0.45);
      g.lineWidth = 2.5;
      for (let y = 72, r = 0; y < 112; y += 10, r++) {
        for (let x = 4 + (r % 2 ? 9 : 0); x < 124; x += 18) g.strokeRect(x, y, 18, 10);
      }
      g.fillStyle = '#8a4b22';
      for (let x = 4; x < 124; x += 20) g.fillRect(x, 113, 18, 13);
      g.fillStyle = '#d63a2f';
      g.beginPath(); g.arc(104, 80, 13, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#ffffff';
      g.lineWidth = 3;
      g.stroke();
      g.fillStyle = '#ffd83a';
      g.beginPath(); g.arc(88, 60, 13, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.ellipse(112, 56, 7, 12, 0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(84, 56, 4.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#111111';
      g.beginPath(); g.arc(83, 57, 2, 0, Math.PI * 2); g.fill();
    } else if (kind === 'bolt') {
      g.fillStyle = '#ffd400';
      g.beginPath();
      g.moveTo(74, 14); g.lineTo(40, 70); g.lineTo(62, 70); g.lineTo(50, 116); g.lineTo(90, 54); g.lineTo(68, 54);
      g.closePath();
      g.fill();
    } else if (kind === 'star') {
      g.fillStyle = '#ffffff';
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? 16 : 38, a = -Math.PI / 2 + (i * Math.PI) / 5;
        g.lineTo(64 + Math.cos(a) * r, 62 + Math.sin(a) * r);
      }
      g.closePath();
      g.fill();
    } else if (kind === 'panel') {
      g.fillStyle = '#24232b';
      roundRect(g, 26, 22, 76, 76, 12);
      g.fill();
      const gr = g.createRadialGradient(64, 60, 2, 64, 60, 24);
      gr.addColorStop(0, '#ffffff');
      gr.addColorStop(0.4, '#5ef2ff');
      gr.addColorStop(1, 'rgba(94,242,255,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(64, 60, 24, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#5ef2ff';
      for (let i = 0; i < 3; i++) g.fillRect(36 + i * 22, 88, 14, 4);
    } else if (kind === 'torn') {
      // rips with skin showing through, and a few stitches
      for (const [x, y, w, h] of [[22, 30, 26, 20], [74, 64, 34, 22], [36, 92, 22, 18]]) {
        g.fillStyle = skin;
        g.beginPath();
        g.moveTo(x, y + h / 2);
        for (let i = 1; i <= 6; i++) g.lineTo(x + (w * i) / 6, y + (i % 2 ? 0 : h * 0.3));
        for (let i = 6; i >= 0; i--) g.lineTo(x + (w * i) / 6, y + h - (i % 2 ? 0 : h * 0.3));
        g.closePath();
        g.fill();
        g.strokeStyle = 'rgba(0,0,0,0.5)';
        g.lineWidth = 2;
        g.stroke();
      }
      g.strokeStyle = '#2b2233';
      g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(84, 18); g.lineTo(84, 44); g.stroke();
      for (let y = 22; y < 44; y += 6) { g.beginPath(); g.moveTo(79, y); g.lineTo(89, y); g.stroke(); }
    } else if (kind === 'ufo') {
      const ink = '#555c5e';
      g.fillStyle = 'rgba(240,226,140,0.75)'; // beam
      g.beginPath(); g.moveTo(84, 30); g.lineTo(98, 30); g.lineTo(122, 120); g.lineTo(64, 120); g.closePath(); g.fill();
      g.fillStyle = ink;
      g.beginPath(); g.ellipse(91, 24, 26, 8, 0, 0, Math.PI * 2); g.fill(); // saucer
      g.fillStyle = '#8a9294';
      g.beginPath(); g.arc(91, 18, 9, Math.PI, 0); g.fill(); // dome
      g.fillStyle = '#ffe066';
      for (const x of [72, 84, 98, 110]) { g.beginPath(); g.arc(x, 25, 2, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = ink;
      g.beginPath(); g.arc(36, 52, 15, 0, Math.PI * 2); g.fill(); // planets
      g.beginPath(); g.arc(52, 22, 6, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(94, 98, 15, 11, -0.3, 0, Math.PI * 2); g.fill(); // dinosaur
      g.beginPath(); g.ellipse(100, 74, 6, 12, 0.2, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(82, 102); g.lineTo(58, 118); g.lineTo(86, 108); g.closePath(); g.fill();
      g.fillRect(88, 106, 5, 12);
      g.fillRect(98, 106, 5, 12);
    } else if (kind === 'paw') {
      g.fillStyle = '#ffffff';
      g.beginPath(); g.ellipse(64, 74, 22, 18, 0, 0, Math.PI * 2); g.fill();
      for (const [x, y] of [[38, 46], [54, 34], [74, 34], [90, 46]]) {
        g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2); g.fill();
      }
    }
    return (printCache[key] = toTexture(c));
  }

  // Spiky hair tufts: [x, z, height, lean forward/back, lean sideways]. The last one is the tuft that sticks up.
  const SPIKES = [
    [-0.18, -0.13, 0.17, -0.5, 0.35], [-0.06, -0.17, 0.2, -0.6, 0.1], [0.07, -0.16, 0.19, -0.55, -0.15], [0.19, -0.12, 0.16, -0.4, -0.4],
    [-0.17, 0.03, 0.19, 0.05, 0.45], [0.0, -0.02, 0.22, -0.1, 0.0], [0.16, 0.04, 0.19, 0.1, -0.45],
    [-0.1, 0.16, 0.17, 0.5, 0.25], [0.1, 0.17, 0.17, 0.55, -0.25], [-0.03, -0.08, 0.38, -0.3, 0.4],
  ];

  // A blocky cartoon person facing -z. `rig` pivots near the waist so rolls spin around the body's middle.
  // c.head: 'human' | 'robot' | 'bear';  c.hair: 'spiky' | 'short' | 'ponytail';  c.hat: 'cap' | 'capBack';
  // c.shirt: 'tee' | 'hoodie' | 'jacket';  c.print: 'bricks' | 'bolt' | 'star' | 'panel' | 'paw'.
  function build(c) {
    const root = new T.Group();
    const rig = new T.Group();
    rig.position.y = 0.55;
    root.add(rig);
    const hipY = 0.88 - 0.55;
    const hips = new T.Group();
    hips.position.y = hipY;
    rig.add(hips);
    const m = (col, o) => std(col, Object.assign({ roughness: 0.7 }, o));
    const skin = c.head === 'robot' ? m(c.skin, { metalness: 0.5, roughness: 0.35 }) : m(c.skin);
    const top = m(c.top), bottom = m(c.bottom), dark = m('#1b1a22'), white = m('#f4f4f4');
    const box = (w, h, d, mat, x, y, z, parent) => mesh(new T.BoxGeometry(w, h, d), mat, x, y, z, parent);

    // torso: the print goes on the front face (-z)
    const tw = c.belly ? 0.74 : 0.62, td = c.belly ? 0.46 : 0.36;
    const front = c.print ? m('#ffffff', { map: printTexture(c.print, c.top, c.skin) }) : top;
    box(tw, 0.66, td, [top, top, top, top, top, front], 0, 0.33, 0, hips);
    box(tw + 0.02, 0.1, td + 0.02, bottom, 0, 0.04, 0, hips);
    if (c.shirt === 'hoodie') box(0.5, 0.16, 0.14, top, 0, 0.62, 0.17, hips);

    const head = new T.Group();
    head.position.y = 0.93;
    hips.add(head);
    if (c.head === 'robot') robotHead(c, head, box, skin, dark, m);
    else if (c.head === 'bear') bearHead(c, head, box, skin, dark, m);
    else humanHead(c, head, box, skin, dark, white, m);

    const limb = (x, y, parts) => {
      const g = new T.Group();
      g.position.set(x, y, 0);
      hips.add(g);
      parts.forEach(([w, h, d, mat, py, pz]) => box(w, h, d, mat, 0, py, pz || 0, g));
      return g;
    };
    const armParts = c.shirt === 'tee'
      ? [[0.21, 0.26, 0.23, top, -0.11], [0.15, 0.38, 0.16, skin, -0.42], [0.16, 0.14, 0.17, skin, -0.65]]
      : [[0.18, 0.6, 0.2, top, -0.28], [0.16, 0.14, 0.17, skin, -0.63]];
    const shoes = m(c.shoes);
    const legParts = c.shorts
      ? [[0.26, 0.34, 0.28, bottom, -0.17], [0.19, 0.4, 0.2, skin, -0.48], [0.28, 0.16, 0.42, shoes, -0.74, -0.06], [0.3, 0.06, 0.44, white, -0.82, -0.06]]
      : [[0.24, 0.7, 0.26, bottom, -0.35], [0.28, 0.16, 0.42, shoes, -0.74, -0.06], [0.3, 0.06, 0.44, white, -0.82, -0.06]];
    const armL = limb(-(tw / 2 + 0.1), 0.6, armParts);
    const armR = limb(tw / 2 + 0.1, 0.6, armParts);
    const fingers = [];
    if (c.peace) {
      for (const arm of [armL, armR]) {
        for (const side of [-1, 1]) {
          const f = mesh(new T.BoxGeometry(0.04, 0.14, 0.045).translate(0, -0.07, 0), skin, side * 0.03, -0.71, 0, arm);
          f.rotation.z = side * 0.28;
          f.visible = false;
          fingers.push(f);
        }
      }
    }
    const legL = limb(-0.16, 0, legParts);
    const legR = limb(0.16, 0, legParts);

    if (c.pack) {
      box(0.48, 0.52, 0.22, m(c.pack), 0, 0.36, 0.3, hips);
      box(0.34, 0.2, 0.06, m(c.packPocket || '#ffffff'), 0, 0.24, 0.43, hips);
    }
    return { root, rig, hips, head, armL, armR, legL, legR, hipY, fingers, zombie: !!c.zombie };
  }

  // Dark sockets, mismatched glowing pupils, a snaggle-toothed mouth and a stitched scar: spooky, not gory.
  function zombieFace(head, box, dark, white, m) {
    box(0.13, 0.11, 0.03, dark, -0.11, 0.04, -0.235, head);
    box(0.13, 0.11, 0.03, dark, 0.11, 0.04, -0.235, head);
    const glow = new T.MeshBasicMaterial({ color: '#f6ff7a' });
    box(0.045, 0.045, 0.02, glow, -0.1, 0.03, -0.252, head);
    box(0.05, 0.05, 0.02, glow, 0.12, 0.055, -0.252, head);
    box(0.26, 0.09, 0.02, m('#3a1d1d'), 0, -0.12, -0.232, head);
    for (const x of [-0.08, 0.0, 0.07]) box(0.045, 0.045, 0.03, white, x, -0.095, -0.236, head);
    box(0.17, 0.025, 0.03, dark, 0.06, 0.17, -0.236, head);
    for (const x of [0.0, 0.05, 0.1]) box(0.015, 0.06, 0.035, dark, x, 0.17, -0.236, head);
  }

  function humanHead(c, head, box, skin, dark, white, m) {
    box(0.5, 0.48, 0.46, skin, 0, 0, 0, head);
    const hair = m(c.hairColor || '#2a1a12');
    if (c.zombie) zombieFace(head, box, dark, white, m);
    else {
      const eyeH = c.smile ? 0.065 : 0.1;
      box(0.08, eyeH, 0.03, dark, -0.11, 0.04, -0.235, head);
      box(0.08, eyeH, 0.03, dark, 0.11, 0.04, -0.235, head);
      if (c.brows) {
        box(0.12, 0.03, 0.03, hair, -0.11, 0.12, -0.235, head);
        box(0.12, 0.03, 0.03, hair, 0.11, 0.12, -0.235, head);
      }
      if (c.mustache) box(0.3, 0.07, 0.04, m('#3b2516'), 0, -0.1, -0.24, head);
      else if (c.smile) {
        box(0.25, 0.1, 0.02, m('#6b2a22'), 0, -0.12, -0.232, head); // open grin
        box(0.2, 0.045, 0.03, white, 0, -0.095, -0.236, head); // teeth
      } else box(0.16, 0.04, 0.03, m('#8a3b2e'), 0, -0.12, -0.235, head);
    }
    box(0.07, 0.14, 0.12, skin, -0.28, 0, 0, head);
    box(0.07, 0.14, 0.12, skin, 0.28, 0, 0, head);

    if (c.hat) {
      box(0.52, 0.24, 0.12, hair, 0, 0.04, 0.19, head);
      const hat = m(c.hatColor);
      box(0.54, 0.16, 0.5, hat, 0, 0.3, 0, head);
      const back = c.hat === 'capBack';
      box(0.46, 0.05, 0.3, back ? hat : dark, 0, 0.24, back ? 0.37 : -0.37, head);
      if (c.badge) box(0.12, 0.1, 0.03, m('#ffd400'), 0, 0.3, -0.26, head);
    } else {
      box(0.54, 0.1, 0.5, hair, 0, 0.27, 0, head); // crown
      box(0.53, c.hair === 'ponytail' ? 0.44 : 0.36, 0.08, hair, 0, c.hair === 'ponytail' ? 0.02 : 0.08, 0.22, head); // back
      box(0.05, 0.2, 0.42, hair, -0.27, 0.15, 0.02, head); // sides above the ears
      box(0.05, 0.2, 0.42, hair, 0.27, 0.15, 0.02, head);
      if (c.hair === 'spiky') {
        for (const [x, z, h, lx, lz] of SPIKES) {
          const s = mesh(new T.BoxGeometry(0.11, h, 0.11).translate(0, h / 2, 0), hair, x, 0.29, z, head);
          s.rotation.set(lx, 0, lz);
        }
      } else if (c.hair === 'ponytail') {
        box(0.5, 0.08, 0.06, hair, 0, 0.2, -0.22, head); // fringe
        box(0.2, 0.08, 0.1, m(c.top), 0, 0.2, 0.3, head); // hair tie
        const tail = mesh(new T.BoxGeometry(0.16, 0.46, 0.14).translate(0, -0.23, 0), hair, 0, 0.2, 0.32, head);
        tail.rotation.x = 0.35;
      } else {
        box(0.5, 0.07, 0.06, hair, 0, 0.21, -0.22, head);
      }
    }
    if (c.headphones) {
      const phones = m(c.headphones);
      const band = new T.Mesh(new T.TorusGeometry(0.3, 0.035, 6, 18, Math.PI), phones);
      band.position.y = 0.06;
      head.add(band);
      box(0.08, 0.18, 0.18, phones, -0.3, 0.02, 0, head);
      box(0.08, 0.18, 0.18, phones, 0.3, 0.02, 0, head);
    }
  }

  function robotHead(c, head, box, metal, dark, m) {
    box(0.54, 0.46, 0.48, metal, 0, 0.01, 0, head);
    box(0.46, 0.2, 0.03, dark, 0, 0.05, -0.245, head); // visor
    const glow = new T.MeshBasicMaterial({ color: c.eyes || '#5ef2ff' });
    box(0.1, 0.07, 0.02, glow, -0.11, 0.05, -0.262, head);
    box(0.1, 0.07, 0.02, glow, 0.11, 0.05, -0.262, head);
    box(0.16, 0.03, 0.02, glow, 0, -0.13, -0.245, head);
    box(0.04, 0.2, 0.04, dark, 0, 0.33, 0, head); // antenna
    mesh(new T.SphereGeometry(0.06, 10, 8), new T.MeshBasicMaterial({ color: '#ff3d3d' }), 0, 0.46, 0, head, false);
    box(0.06, 0.16, 0.16, m(c.top), -0.29, 0, 0, head);
    box(0.06, 0.16, 0.16, m(c.top), 0.29, 0, 0, head);
  }

  function bearHead(c, head, box, fur, dark, m) {
    box(0.54, 0.48, 0.48, fur, 0, 0, 0, head);
    const pink = m('#f2a3a3');
    for (const x of [-0.2, 0.2]) {
      box(0.15, 0.15, 0.1, fur, x, 0.29, 0.02, head);
      box(0.08, 0.08, 0.02, pink, x, 0.29, -0.035, head);
    }
    box(0.26, 0.17, 0.1, m(c.muzzle || '#d9b48a'), 0, -0.09, -0.26, head);
    box(0.1, 0.06, 0.04, dark, 0, -0.04, -0.315, head);
    box(0.08, 0.02, 0.02, dark, 0, -0.13, -0.312, head);
    box(0.07, 0.08, 0.03, dark, -0.12, 0.07, -0.245, head);
    box(0.07, 0.08, 0.03, dark, 0.12, 0.07, -0.245, head);
  }

  const MODES = ['run', 'walk', 'jump', 'roll', 'jet', 'fall', 'grab', 'wave', 'give', 'peace', 'guard', 'jab', 'straight', 'boxing', 'jumpshot'];

  // Ease a person's limbs toward a named pose. `ph` is a running phase in radians that drives cycles (strides,
  // waves, the boxing combo); `k` in 0..1 is how far to move this frame (1 snaps). Unknown modes stand still.
  // Arms pivot at the shoulder and legs at the hip: rotation.x swings forward/back, rotation.z swings out sideways.
  function pose(p, ph, mode, k) {
    const s = Math.sin(ph), c = Math.cos(ph);
    let ll = 0, rl = 0, la = 0, ra = 0, az = 0, laz = null, raz = null, lean = -0.12, bob = 0, head = 0, twist = 0, sc = 1;
    if (mode === 'boxing') {
      // shadow-boxing: jab, guard, straight, guard, one beat per quarter turn of the phase
      const beat = Math.floor((((ph / (Math.PI * 2)) % 1) + 1) % 1 * 4);
      mode = beat === 0 ? 'jab' : beat === 2 ? 'straight' : 'guard';
    }
    switch (mode) {
      case 'run': ll = s * 0.95; rl = -s * 0.95; la = -s * 0.85; ra = s * 0.85; bob = Math.abs(c) * 0.09; break;
      case 'walk': ll = s * 0.45; rl = -s * 0.45; la = -s * 0.3; ra = s * 0.3; bob = Math.abs(c) * 0.05; lean = -0.05; break;
      case 'jump': ll = 0.8; rl = -0.4; la = 2.5; ra = 2.1; az = 0.3; lean = -0.05; break;
      case 'roll': ll = rl = 2.0; la = ra = 1.3; lean = -0.6; head = 0.4; sc = 0.8; break;
      case 'jet': ll = 0.2 + s * 0.08; rl = -0.1 - s * 0.08; la = ra = 0.35; az = 0.25; lean = -0.4; break;
      case 'fall': ll = 1.0; rl = 0.6; la = ra = 2.7; az = 0.6; lean = 0.55; head = -0.3; break;
      case 'grab': ll = 0.15; rl = -0.15; la = ra = 1.45; lean = -0.1; break;
      case 'wave': ll = s * 0.95; rl = -s * 0.95; la = -s * 0.85; ra = 2.9; raz = 0.35 + Math.sin(ph * 2.5) * 0.35; bob = Math.abs(c) * 0.09; break;
      case 'give': ll = s * 0.95; rl = -s * 0.95; la = -s * 0.85; ra = 1.55; raz = -0.5; bob = Math.abs(c) * 0.09; break;
      // Tommy's favourite: both arms up in a Y with peace fingers (比耶)
      case 'peace': ll = s * 0.95; rl = -s * 0.95; la = ra = 0.15; az = 2.6 + Math.sin(ph * 2) * 0.1; bob = Math.abs(c) * 0.09; lean = 0; head = -0.1; break;
      // Teddy's boxing, Mike Tyson style: peek-a-boo guard with fists by the chin, then jab (lead hand) and straight (rear hand)
      case 'guard': ll = 0.45; rl = -0.25; la = ra = 2.15; az = -0.38; lean = -0.28; head = 0.15; bob = Math.abs(s) * 0.04 - 0.06; break;
      case 'jab': ll = 0.45; rl = -0.25; la = 1.62; laz = 0.05; ra = 2.15; raz = -0.38; lean = -0.25; twist = -0.3; head = 0.15; bob = -0.06; break;
      case 'straight': ll = 0.5; rl = -0.4; la = 2.15; laz = 0.38; ra = 1.62; raz = -0.05; lean = -0.32; twist = 0.4; head = 0.15; bob = -0.06; break;
      // Teddy's basketball jump shot: both hands up and forward in the shooting motion, eyes on the hoop
      // (the game adds the jump and the ball)
      case 'jumpshot': ll = rl = 0.25; la = 2.45; ra = 2.6; az = -0.2; lean = 0.05; head = -0.3; break;
    }
    if (p.zombie && mode !== 'roll' && mode !== 'fall') {
      la = 1.5 + s * 0.08;
      ra = 1.38 - s * 0.08;
      az = 0;
      laz = raz = null;
      head = 0.15 + s * 0.06;
    }
    const to = (o, prop, v) => { o[prop] += (v - o[prop]) * k; };
    to(p.legL.rotation, 'x', ll);
    to(p.legR.rotation, 'x', rl);
    to(p.armL.rotation, 'x', la);
    to(p.armR.rotation, 'x', ra);
    to(p.armL.rotation, 'z', laz === null ? -az : laz);
    to(p.armR.rotation, 'z', raz === null ? az : raz);
    to(p.hips.rotation, 'x', lean);
    to(p.hips.rotation, 'y', twist);
    to(p.head.rotation, 'x', head);
    p.hips.position.y = p.hipY + bob;
    if (p.fingers) for (const f of p.fingers) f.visible = mode === 'peace';
    p.rig.scale.setScalar(p.rig.scale.x + (sc - p.rig.scale.x) * k);
  }

  // World position of a hand (side -1 = left, 1 = right), e.g. to hold or throw a prop. Needs an up-to-date
  // matrixWorld (after a render, or call p.root.updateMatrixWorld(true) first).
  function handWorld(p, side, out = new T.Vector3()) {
    return (side < 0 ? p.armL : p.armR).localToWorld(out.set(0, -0.7, 0));
  }

  Kit.people = { build, pose, handWorld, MODES };
})();

</script>
<script>
/* Claude Games kit: the characters every game can use. Load after people.js. Exposes window.Kit.roster.
   Each entry: id, name, look (passed to Kit.people.build), plus optional
     pose        - pose for menu portraits (Kit.portraits)
     signature   - pose names for celebrations, in order: hello first, goodbye last
     buddyScale  - size when he runs alongside another character as a buddy
     tag         - name-tag colour when he's a buddy
     scare       - the zombie: games may play a (harmless) scare when he's picked
   To add someone (say, Dad), copy an entry, give it a new id and change the colours and styles. Styles are listed
   at Kit.people.build in people.js. */
(function () {
  'use strict';
  const Kit = window.Kit;

  const list = [
    {
      // Modelled on his photo: black spiky hair, big grin, blue brick-wall tee, red sneakers.
      id: 'teddy',
      name: 'TEDDY',
      signature: ['boxing', 'jumpshot'], // Mike Tyson-style jab + straight, and a basketball jump shot
      buddyScale: 0.85,
      tag: '#8cc2ff',
      look: {
        head: 'human', skin: '#efc29c', hair: 'spiky', hairColor: '#16130f', brows: true, smile: true,
        shirt: 'tee', top: '#4a86cf', print: 'bricks', bottom: '#2b3140', shoes: '#e53935',
      },
    },
    {
      // Modelled on his photo: short black hair, mint UFO-and-dinosaur tee, cream joggers.
      id: 'tommy',
      name: 'TOMMY',
      pose: 'peace',
      signature: ['peace'], // his favourite: both arms up in a Y with peace fingers (比耶)
      buddyScale: 0.72,
      tag: '#ffb02e',
      look: {
        head: 'human', skin: '#efc6a2', hair: 'short', hairColor: '#15120e', brows: true, peace: true,
        shirt: 'tee', top: '#c3d6cf', print: 'ufo', bottom: '#e6dfd0', shoes: '#2f4a7a',
      },
    },
    {
      id: 'zoom',
      name: 'ZOOM',
      look: {
        head: 'human', skin: '#f2c49c', hair: 'short', hairColor: '#4a2f1d', hat: 'capBack', hatColor: '#18b4ff',
        shirt: 'hoodie', top: '#ff3d7f', print: 'bolt', bottom: '#2d5fb8', shoes: '#ffd400',
        pack: '#ffb02e', packPocket: '#18b4ff', headphones: '#22212a',
      },
    },
    {
      id: 'luna',
      name: 'LUNA',
      look: {
        head: 'human', skin: '#b27a52', hair: 'ponytail', hairColor: '#2a1a12', brows: true, smile: true,
        shirt: 'hoodie', top: '#8d5bd8', print: 'star', bottom: '#20232e', shoes: '#f4f4f4', pack: '#18d4ff',
      },
    },
    {
      id: 'bolt',
      name: 'BOLT',
      look: {
        head: 'robot', skin: '#e6eaef', eyes: '#5ef2ff',
        shirt: 'jacket', top: '#ff8a1f', print: 'panel', bottom: '#5a5f6b', shoes: '#2a2a30',
      },
    },
    {
      id: 'bruno',
      name: 'BRUNO',
      look: {
        head: 'bear', skin: '#8b5a2b', muzzle: '#d9b48a',
        shirt: 'hoodie', top: '#2fb36a', print: 'paw', bottom: '#2b3a63', shorts: true, shoes: '#ff3d7f',
      },
    },
    {
      // Tommy's idea: a cartoon zombie (spooky, not gory). Picking him can trigger a harmless scare.
      id: 'zombie',
      name: 'ZOMBIE',
      scare: true,
      look: {
        head: 'human', zombie: true, skin: '#8fbf6a', hair: 'short', hairColor: '#2b2f22',
        shirt: 'tee', top: '#6d5a8c', print: 'torn', bottom: '#4a4038', shorts: true, shoes: '#5b4636',
      },
    },
  ];

  const get = (id) => list.find((c) => c.id === id) || null;

  // The buddy who comes along: the other brother. Tommy joins everyone except himself, when Teddy comes instead.
  const buddyFor = (id) => (id === 'tommy' ? 'teddy' : 'tommy');

  // Celebration pose for a character: signature[0] says hello, the last one says goodbye.
  const signature = (c, which = 'hello') => {
    const sig = (c && c.signature) || ['wave'];
    return which === 'goodbye' ? sig[sig.length - 1] : sig[0];
  };

  Kit.roster = { list, get, buddyFor, signature };
})();

</script>
<script>
/* Claude Games kit: render characters to PNG data URLs for menus, cards and HUDs, using a throwaway WebGL
   renderer. Load after roster.js. Exposes window.Kit.portraits(entries, opts) and Kit.portraits.frames(look, opts). */
(function () {
  'use strict';
  const T = THREE;
  const Kit = window.Kit;

  function withRenderer(w, h, fn) {
    const r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1);
    r.setSize(w, h, false);
    r.outputEncoding = T.sRGBEncoding;
    const scene = new T.Scene();
    scene.add(new T.HemisphereLight('#ffffff', '#8a6e58', 0.9));
    const key = new T.DirectionalLight('#fff4e0', 1.1);
    key.position.set(-1.5, 3, -3);
    scene.add(key);
    try {
      return fn(r, scene);
    } finally {
      r.dispose();
      r.forceContextLoss();
    }
  }

  // Head-and-shoulders portraits, facing the camera, transparent background: { id: 'data:image/png;...' }.
  // Each entry needs { id, look } and may have `pose` (its favourite pose, e.g. Tommy's Y; the camera pulls back
  // so raised hands fit). opts.size: square size in pixels (default 152).
  function portraits(entries, opts = {}) {
    const size = opts.size || 152;
    return withRenderer(size, size, (r, scene) => {
      const cam = new T.PerspectiveCamera(30, 1, 0.1, 20);
      const out = {};
      for (const e of entries) {
        const p = Kit.people.build(e.look);
        Kit.people.pose(p, 0, e.pose || 'idle', 1);
        p.hips.rotation.x = 0;
        scene.add(p.root);
        if (e.pose) cam.position.set(0.6, 1.95, -3.6), cam.lookAt(0, 1.8, 0);
        else cam.position.set(0.8, 1.95, -2.6), cam.lookAt(0, 1.68, 0);
        r.render(scene, cam);
        out[e.id] = r.domElement.toDataURL('image/png');
        scene.remove(p.root);
      }
      return out;
    });
  }

  // Full-body animation frames (a flipbook) of one character: an array of PNG data URLs.
  // opts: mode (pose, default 'walk'), count (default 4), width/height (default 300x400),
  // tint (hemisphere light colour for a mood, e.g. '#c8ffb0' for the zombie).
  portraits.frames = function (look, opts = {}) {
    const w = opts.width || 300, h = opts.height || 400, count = opts.count || 4;
    return withRenderer(w, h, (r, scene) => {
      if (opts.tint) scene.add(new T.HemisphereLight(opts.tint, '#20301a', 0.6));
      const cam = new T.PerspectiveCamera(35, w / h, 0.1, 20);
      cam.position.set(0, 1.25, -4.4);
      cam.lookAt(0, 1.05, 0);
      const p = Kit.people.build(look);
      scene.add(p.root);
      const frames = [];
      for (let i = 0; i < count; i++) {
        const ph = (i * Math.PI * 2) / count;
        Kit.people.pose(p, ph, opts.mode || 'walk', 1);
        p.root.rotation.y = Math.sin(ph) * 0.15;
        r.render(scene, cam);
        frames.push(r.domElement.toDataURL('image/png'));
      }
      return frames;
    });
  };

  Kit.portraits = portraits;
})();

</script>
<script>
/* Claude Games kit: sound. Every effect and the music loop are synthesised with the Web Audio API, so there are
   no audio files. Exposes window.Kit.sound. Call Kit.sound.init() from the first user gesture (a tap or key);
   effects called before that are silent no-ops. Mute state is remembered in localStorage. */
(function () {
  'use strict';

  let ctx = null, master, sfx, music, noiseBuf, timer = null;
  let muted = false;
  try { muted = localStorage.getItem('claudeGames.muted') === '1'; } catch (e) { /* storage blocked */ }

  const now = () => ctx.currentTime;

  function init() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 10;
    comp.ratio.value = 4;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(comp);
    sfx = ctx.createGain();
    sfx.gain.value = 0.85;
    sfx.connect(master);
    music = ctx.createGain();
    music.gain.value = 0;
    music.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 25);
  }

  function envelope(g, t0, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }

  // One oscillator note with an optional pitch glide and low-pass filter.
  function tone(o) {
    if (!ctx) return;
    const t0 = o.when !== undefined ? o.when : now() + (o.at || 0);
    const dur = o.dur || 0.15;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    const g = ctx.createGain();
    envelope(g, t0, o.vol || 0.2, o.attack || 0.004, dur);
    let node = osc;
    if (o.lp) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = o.lp;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.out || sfx);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  // Filtered white noise: whooshes, hats, snares, crashes.
  function hiss(o) {
    if (!ctx) return;
    const t0 = o.when !== undefined ? o.when : now() + (o.at || 0);
    const dur = o.dur || 0.2;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f || 1000, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    const g = ctx.createGain();
    envelope(g, t0, o.vol || 0.2, o.attack || 0.004, dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.out || sfx);
    src.start(t0, Math.random() * 0.5);
    src.stop(t0 + dur + 0.03);
  }

  // ---- music: a 4-bar Am–F–C–G loop with drums, bass and a little square-wave lead ----
  const BPM = 118, STEP = 60 / BPM / 4;
  const CHORDS = [
    { root: 110.0, notes: [440.0, 523.25, 659.25] }, // Am
    { root: 87.31, notes: [349.23, 440.0, 523.25] }, // F
    { root: 130.81, notes: [392.0, 523.25, 659.25] }, // C
    { root: 98.0, notes: [392.0, 493.88, 587.33] }, // G
  ];
  const LEAD = [0, -1, 1, 2, -1, 1, 0, -1, 2, -1, 1, -1, 2, 1, 0, -1];
  const BASS = [1, 0, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0];
  let step = 0, nextT = 0;

  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    if (nextT < now() - 0.2) nextT = now() + 0.05; // fell behind (tab was hidden): resync
    while (nextT < now() + 0.12) {
      playStep(step++, nextT);
      nextT += STEP;
    }
  }

  function playStep(i, t) {
    const s = i % 16;
    const ch = CHORDS[Math.floor(i / 16) % 4];
    const phrase = Math.floor(i / 64) % 2;
    if (s % 4 === 0) tone({ when: t, f: 150, to: 42, dur: 0.24, vol: 0.9, out: music });
    if (s === 4 || s === 12) {
      hiss({ when: t, f: 1900, dur: 0.16, vol: 0.4, q: 0.7, out: music });
      tone({ when: t, type: 'triangle', f: 200, to: 140, dur: 0.08, vol: 0.25, out: music });
    }
    if (s % 2 === 1) hiss({ when: t, filter: 'highpass', f: 7500, dur: 0.04, vol: s % 4 === 3 ? 0.14 : 0.07, out: music });
    if (BASS[s]) tone({ when: t, type: 'sawtooth', f: ch.root * (s === 6 || s === 13 ? 2 : 1), dur: STEP * 1.7, vol: 0.3, lp: 600, out: music });
    const n = LEAD[s];
    if (n >= 0 && (phrase === 1 || s < 8)) tone({ when: t, type: 'square', f: ch.notes[n], dur: STEP * 1.1, vol: 0.045, lp: 2600, out: music });
  }

  const MUSIC_LEVEL = { play: 0.26, title: 0.18, over: 0.1, pause: 0.05 };

  const Kit = (window.Kit = window.Kit || {});
  Kit.sound = {
    init,
    tone, // tone({ f, to, type, dur, vol, at, lp }) - one synth note, for game-specific effects
    hiss, // hiss({ f, to, filter, q, dur, vol, at }) - filtered noise
    isMuted: () => muted,
    toggleMute: () => setMuted(!muted),
    setMuted,
    onMute(cb) { muteListeners.push(cb); }, // cb(muted), whoever flipped it: the game, the kit button or the ? panel
    setup(o) { btnOpts = o || {}; if (document.body) placeButton(); },
    button: () => btn,
    music(mode) {
      if (ctx) music.gain.setTargetAtTime(MUSIC_LEVEL[mode] ?? 0.2, now(), 0.25);
    },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend(); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); },
    isRunning: () => !!ctx && ctx.state === 'running',

    coin(streak) {
      const k = Math.pow(2, Math.min(streak, 14) / 24); // each coin in a streak rings a little higher
      tone({ type: 'square', f: 988 * k, dur: 0.07, vol: 0.05, lp: 4000 });
      tone({ type: 'triangle', f: 1319 * k, at: 0.055, dur: 0.22, vol: 0.16 });
    },
    jump() {
      tone({ type: 'square', f: 260, to: 620, dur: 0.16, vol: 0.06, lp: 2200 });
      hiss({ f: 900, to: 3000, dur: 0.18, vol: 0.08, q: 0.7 });
    },
    roll() { hiss({ filter: 'lowpass', f: 2400, to: 300, dur: 0.3, vol: 0.2 }); },
    swipe() { hiss({ f: 2600, to: 900, dur: 0.12, vol: 0.12, q: 1.2 }); },
    land() { tone({ f: 140, to: 55, dur: 0.1, vol: 0.22 }); },
    bump() { tone({ f: 110, to: 70, dur: 0.12, vol: 0.25 }); },
    stumble() {
      tone({ f: 180, to: 60, dur: 0.25, vol: 0.35 });
      tone({ type: 'square', f: 520, to: 260, dur: 0.22, vol: 0.06, at: 0.04 });
    },
    crash() {
      hiss({ filter: 'lowpass', f: 4000, to: 150, dur: 0.7, vol: 0.5 });
      tone({ type: 'sawtooth', f: 150, to: 38, dur: 0.6, vol: 0.3, lp: 900 });
    },
    powerup() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.06, dur: 0.18, vol: 0.13 }));
    },
    board() {
      tone({ type: 'sawtooth', f: 200, to: 900, dur: 0.35, vol: 0.08, lp: 1800 });
      hiss({ f: 1500, to: 5000, dur: 0.35, vol: 0.08 });
    },
    boardBreak() {
      hiss({ filter: 'highpass', f: 3000, dur: 0.4, vol: 0.25 });
      tone({ type: 'square', f: 700, to: 120, dur: 0.4, vol: 0.08 });
    },
    horn(vol) {
      [311, 370].forEach((f) => tone({ type: 'sawtooth', f, dur: 0.9, vol: 0.05 * vol, attack: 0.04, lp: 1400 }));
    },
    jet() { hiss({ filter: 'lowpass', f: 600, to: 2400, dur: 0.8, vol: 0.25, attack: 0.1 }); },
    click() { tone({ type: 'square', f: 880, dur: 0.05, vol: 0.05 }); },
    // A cartoon "bonk" for a landed punch or kick.
    punch() {
      tone({ f: 260, to: 90, dur: 0.12, vol: 0.4 });
      hiss({ filter: 'lowpass', f: 1800, to: 300, dur: 0.1, vol: 0.25 });
    },
    // A basketball swishing through the net.
    swish() { hiss({ filter: 'highpass', f: 2500, to: 6000, dur: 0.35, vol: 0.18, attack: 0.05 }); },
    // A wobbling zombie groan, then a "BOO!" sting timed to the scare animation.
    groan() {
      if (!ctx) return;
      const t0 = now(), dur = 1.8;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(95, t0);
      osc.frequency.linearRampToValueAtTime(68, t0 + dur);
      const lfo = ctx.createOscillator(), depth = ctx.createGain();
      lfo.frequency.value = 7;
      depth.gain.value = 12;
      lfo.connect(depth);
      depth.connect(osc.frequency);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 650;
      f.Q.value = 6;
      const g = ctx.createGain();
      envelope(g, t0, 0.35, 0.3, dur);
      osc.connect(f);
      f.connect(g);
      g.connect(sfx);
      osc.start(t0);
      lfo.start(t0);
      osc.stop(t0 + dur + 0.05);
      lfo.stop(t0 + dur + 0.05);
      hiss({ f: 500, to: 300, q: 2, dur: 1.5, vol: 0.12, attack: 0.3 });
      tone({ type: 'square', f: 230, to: 110, at: 2.45, dur: 0.35, vol: 0.12, lp: 1500 });
      hiss({ filter: 'lowpass', f: 3000, to: 400, at: 2.45, dur: 0.4, vol: 0.3 });
    },
  };

  // ---------- mute: one switch for the whole page ----------
  const muteListeners = [];
  function setMuted(m) {
    m = !!m;
    if (m === muted) return muted;
    muted = m;
    try { localStorage.setItem('claudeGames.muted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ }
    if (ctx) master.gain.setTargetAtTime(muted ? 0 : 0.9, now(), 0.03);
    for (const cb of muteListeners) { try { cb(muted); } catch (e) { console.error(e); } }
    return muted;
  }

  // ---------- the sound button, under the language button and the same size ----------
  // Every game has its own 🔊 button, but often only while playing. This one shows whenever the game's own isn't on
  // screen (title, menus, results), so sound can always be switched off with one tap, and never doubles up with it.
  // Icons: Lucide's "volume-2" and "volume-x". Lucide is ISC licensed: Copyright (c) Lucide Contributors 2022.
  // Permission to use, copy, modify, and/or distribute this software for any purpose with or without fee is hereby
  // granted, provided that the above copyright notice and this permission notice appear in all copies.
  // THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES.
  const SPEAKER = '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>';
  const svg = (inner) => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" ' +
    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SPEAKER}${inner}</svg>`;
  const ICON_ON = svg('<path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>');
  const ICON_OFF = svg('<line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>');
  Kit.sound.icon = () => (muted ? ICON_OFF : ICON_ON);

  let btn = null, btnOpts = {}, styled = false;
  const CSS = `
#kit-sound-btn { position: fixed; z-index: 2147482000; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid #fff; background: rgba(20, 18, 31, 0.62); color: #fff; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#kit-sound-btn:hover { background: #ffd400; color: #14121f; border-color: #14121f; }
#kit-sound-btn.off { background: rgba(120, 20, 40, 0.75); }
`;

  // The game's own sound buttons: just 🔊 or 🔇 (Spot TT Animals' settings say "🔊 ON"). Word Pop's "hear the word"
  // button also starts with 🔊 but has more text, so it isn't one.
  const GAME_BTN = /^(🔊|🔇)(\s*(ON|OFF|开|关))?$/;
  const isGameBtn = (b) => b !== btn && GAME_BTN.test((b.textContent || '').trim());
  const WORD = { ON: ['ON', 'OFF'], OFF: ['ON', 'OFF'], 开: ['开', '关'], 关: ['开', '关'] };
  function onScreen(el) {
    if (el.checkVisibility && !el.checkVisibility({ opacityProperty: true, visibilityProperty: true })) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 4 || r.height < 4 || r.bottom <= 0 || r.right <= 0 || r.top >= innerHeight || r.left >= innerWidth) return false;
    const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    return !!hit && (hit === el || el.contains(hit)); // not hidden behind a menu or a fade
  }
  function syncGameButtons() {
    for (const b of document.querySelectorAll('button')) {
      if (!isGameBtn(b)) continue;
      const word = (b.textContent.match(/ON|OFF|开|关/) || [])[0];
      b.textContent = (muted ? '🔇' : '🔊') + (word ? ' ' + WORD[word][muted ? 1 : 0] : '');
      if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', muted ? 'true' : 'false');
    }
  }

  function placeButton() {
    if (!styled) {
      styled = true;
      const style = document.createElement('style');
      style.textContent = CSS;
      document.head.appendChild(style);
    }
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'kit-sound-btn';
      btn.type = 'button';
      btn.title = 'Sound on / off';
      btn.setAttribute('aria-label', 'Sound on / off');
      btn.style.display = 'none';
      document.body.appendChild(btn);
    }
    paint();
    refresh();
  }
  function paint() {
    if (!btn) return;
    btn.innerHTML = Kit.sound.icon();
    btn.classList.toggle('off', muted);
    btn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  // Show it only when the game's own sound button isn't on screen, right under the language button (or the ? button),
  // wherever the game has moved those.
  function refresh() {
    if (!btn) return;
    const own = [...document.querySelectorAll('button')].some((b) => isGameBtn(b) && onScreen(b));
    if (btnOpts.button === false || own) { btn.style.display = 'none'; return; }
    if (btnOpts.button) {
      // The same left edge as the ? and language buttons, so a game that only moves it up or down keeps the three in line.
      const pos = Object.assign(btnOpts.button.right == null ? { left: 'max(10px, env(safe-area-inset-left))' } : {}, btnOpts.button);
      for (const side of ['top', 'right', 'bottom', 'left']) btn.style[side] = pos[side] == null ? '' : pos[side];
    } else {
      const above = ['kit-lang-btn', 'kit-help-btn'].map((id) => document.getElementById(id))
        .find((b) => b && b.style.display !== 'none' && b.getBoundingClientRect().width > 0);
      let top = innerHeight / 2 + 76, left = 10;
      if (above) {
        const r = above.getBoundingClientRect();
        top = r.bottom + 8;
        left = r.left;
        if (top + 44 > innerHeight) top = Math.max(4, r.top - 48 * (above.id === 'kit-lang-btn' ? 2 : 1)); // short screen: go above the ? instead
      }
      btn.style.top = top + 'px';
      btn.style.left = left + 'px';
      btn.style.right = btn.style.bottom = '';
    }
    btn.style.display = '';
  }
  muteListeners.push(() => { paint(); syncGameButtons(); });

  // Taps on the button never reach the game (like the ? and language buttons): one click switches the sound.
  for (const type of ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click', 'dblclick']) {
    window.addEventListener(type, (e) => {
      if (!btn || !btn.contains(e.target)) return;
      e.stopImmediatePropagation();
      if (e.type === 'click') { init(); setMuted(!muted); }
    }, { capture: true, passive: false });
  }
  function start() { placeButton(); setInterval(refresh, 400); addEventListener('resize', refresh); }
  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start, { once: true });
})();

</script>
<script>
/* Kit.lang: every game in English or 中文.

   - The choice is remembered under one localStorage key ('claudeGames.lang'), shared by every game and the dashboard on
     the same site, so switching on the dashboard switches the games too. A first visit is in English.
   - A round language button (Lucide's A文 icon) sits under the ? button (and the ? panel has one too). A tap switches language, live: no reload.
   - Page text translates by itself. A dictionary (English -> 中文) is checked against every text node and every
     placeholder, title and aria-label, now and whenever the game changes the page later (a MutationObserver), so a
     game that sets `el.textContent = 'TOMMY SAVED YOU!'` needs no code change, just a dictionary entry.
   - Text with numbers or names in it ("TEDDY'S BEST", "3 HITS!") uses rules: a regex and a replacement.
   - Text the game draws on a canvas (3D word bursts, signs) never reaches the page, so wrap it: Kit.lang.t('POW!').
   - An element whose HTML needs a different word order in Chinese can carry the whole translation: data-zh="...".
     The element's English HTML is kept, and swapped back when switching to English.
   - data-no-lang on an element keeps its text (and its children's) as it is.

   In a game, load kit/lang.js right after kit/sound.js (before kit/help.js), and put the game's words in js/zh.js:

     Kit.lang.add({ 'PLAY': '开始', 'TOMMY SAVED YOU!': 'TOMMY 救了你！' });
     Kit.lang.rule(/^(\w+)'S BEST$/, '$1 的最高分');
     Kit.lang.keep(['TEDDY', 'TOMMY']);            // names that stay as they are
     Kit.lang.onChange((lang) => rebuildSigns());  // only for canvas text made once and kept

   Kit.lang.untranslated() lists the English still showing on the page (and canvas text asked for through t() with no
   entry): switch to 中文, visit every screen, and run it until it comes back empty. */
(function () {
  const Kit = (window.Kit = window.Kit || {});
  const KEY = 'claudeGames.lang';

  let lang = '';
  try { lang = localStorage.getItem(KEY) || ''; } catch (e) { /* storage blocked */ }
  if (lang !== 'en' && lang !== 'zh') lang = 'en'; // English until someone picks 中文 (Alan's choice)

  const dict = new Map();
  const rules = [];
  const kept = new Set();
  const askedMissing = new Set();
  const listeners = [];

  // Words every game shares: the ? panel, menus, buttons. A game's own js/zh.js can override any of them.
  const COMMON = {
    '? KEYS': '? 按键', 'these keys': '看按键', 'or tap the round': '或点圆形', 'button': '按钮',
    'or': '或', 'then': '然后', 'hold': '按住', 'tap': '点', 'click': '点击', 'swipe': '滑动', 'drag': '拖动',
    'double-tap': '连按两下', 'and': '和', 'longer': '更久', 'Space': '空格', 'Enter': '回车',
    'Player 1': '玩家 1', 'Player 2': '玩家 2', 'Teddy': 'Teddy', 'Tommy': 'Tommy',
    'move': '移动', 'walk': '走', 'run': '跑', 'jump': '跳', 'pause': '暂停', 'sound on / off': '声音 开 / 关',
    'pause · sound': '暂停 · 声音', 'call your brother': '叫兄弟来帮忙', 'call your brother · high five': '叫兄弟 · 击掌',
    'easy mode (title)': '简单模式（标题页）', 'In 1 player both sets of keys work.': '单人时两套按键都能用。',
    'PLAY': '开始', '▶ PLAY': '▶ 开始', 'PAUSED': '暂停中', 'RESUME': '继续', '▶ RESUME': '▶ 继续', 'MENU': '菜单',
    'EASY': '简单', 'NORMAL': '普通', '1 PLAYER': '单人', '2 PLAYERS': '双人', 'BEST': '最高分', 'SCORE': '得分',
    'GAME OVER': '游戏结束', 'PLAY AGAIN': '再玩一次', 'NEXT': '下一关', 'BACK': '返回', 'HOME': '主页', 'GO!': '开始！',
    'READY?': '准备好了吗？', 'YOU WIN!': '你赢了！', 'TAP ME!': '点我！', 'built with': '制作工具：',
    'Keys (?)': '按键 (?)', 'Show the keys': '看按键', 'Sound on / off': '声音 开 / 关', 'Keys': '按键',
  };
  for (const k in COMMON) dict.set(k, COMMON[k]);

  // ---------- translating one string ----------
  const looksEnglish = (s) => /[A-Za-z]{2,}/.test(s);
  function lookup(key) {
    if (dict.has(key)) return dict.get(key);
    for (const [re, rep] of rules) if (re.test(key)) return key.replace(re, rep);
    return null;
  }
  // t('POW!') -> '砰！' in 中文 (from the dictionary), t('Score', '得分') -> an inline pair. Spaces around the words stay.
  function t(en, zh) {
    if (zh !== undefined) return lang === 'zh' ? zh : en;
    if (lang !== 'zh' || en == null) return en;
    const s = String(en), key = s.trim();
    if (!key || kept.has(key)) return s;
    const out = lookup(key);
    if (out == null) { if (looksEnglish(key)) askedMissing.add(key); return s; }
    return s.replace(key, out);
  }

  // ---------- the page ----------
  const SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'NOSCRIPT', 'CODE', 'PRE']);
  const ATTRS = ['placeholder', 'title', 'aria-label'];
  const enText = new WeakMap(); // text node -> its English
  const ourText = new WeakMap(); // text node -> what we last wrote into it

  function skipped(el) {
    return !el || SKIP.has(el.nodeName) || (el.closest && el.closest('[data-no-lang],[data-zh],#kit-help'));
  }
  function doText(n) {
    if (skipped(n.parentNode)) return;
    const cur = n.nodeValue;
    let en = enText.get(n);
    if (en === undefined || cur !== ourText.get(n)) { en = cur; enText.set(n, en); } // new, or the game rewrote it
    const out = lang === 'zh' ? t(en) : en;
    ourText.set(n, out);
    if (out !== cur) n.nodeValue = out;
  }
  function doElement(el) {
    if (el.hasAttribute('data-zh')) {
      if (!el.hasAttribute('data-en')) el.setAttribute('data-en', el.innerHTML);
      const html = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
      if (el.innerHTML !== html) el.innerHTML = html;
    }
    if (skipped(el)) return;
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const store = 'data-en-' + a;
      if (!el.hasAttribute(store) || el.getAttribute(a) !== el.getAttribute('data-out-' + a)) el.setAttribute(store, el.getAttribute(a));
      const out = lang === 'zh' ? t(el.getAttribute(store)) : el.getAttribute(store);
      el.setAttribute('data-out-' + a, out);
      if (el.getAttribute(a) !== out) el.setAttribute(a, out);
    }
  }
  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) return doText(root);
    if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    if (root.nodeType === 1) doElement(root);
    if (root.nodeType === 1 && SKIP.has(root.nodeName)) return;
    const it = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let n;
    while ((n = it.nextNode())) (n.nodeType === 3 ? doText(n) : doElement(n));
  }
  // Our own writes come back here too (observers report later), and stop at once: the text matches what we wrote.
  const observer = new MutationObserver((list) => {
    for (const m of list) {
      if (m.type === 'characterData') doText(m.target);
      else if (m.type === 'attributes') doElement(m.target);
      else for (const n of m.addedNodes) walk(n);
    }
  });

  function applyAll() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    document.documentElement.classList.toggle('lang-zh', lang === 'zh');
    if (document.body) walk(document.body);
    if (btn) btn.title = lang === 'zh' ? 'English' : '中文'; // the hover hint names the language a tap switches to
  }

  // ---------- switching ----------
  function set(l) {
    if (l !== 'en' && l !== 'zh') return lang;
    lang = l;
    try { localStorage.setItem(KEY, l); } catch (e) { /* storage blocked */ }
    applyAll();
    for (const cb of listeners) { try { cb(lang); } catch (e) { console.error(e); } }
    return lang;
  }
  const toggle = () => set(lang === 'zh' ? 'en' : 'zh');

  // ---------- the language button, under the ? button and the same size ----------
  // The icon is Lucide's "languages" (an A next to a Chinese character), from lucide-static 0.460.0.
  // Lucide is ISC licensed: Copyright (c) Lucide Contributors 2022. Permission to use, copy, modify, and/or distribute this
  // software for any purpose with or without fee is hereby granted, provided that the above copyright notice and this
  // permission notice appear in all copies. THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES.
  const ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/>' +
    '<path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>';
  let btn = null, btnOpts = {};
  const CSS = `
#kit-lang-btn { position: fixed; z-index: 2147482000; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid #fff; background: rgba(20, 18, 31, 0.62); color: #fff; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#kit-lang-btn:hover { background: #ffd400; color: #14121f; border-color: #14121f; }
`;
  let styled = false;
  function placeButton() {
    if (!styled) {
      styled = true;
      const style = document.createElement('style');
      style.textContent = CSS;
      document.head.appendChild(style);
    }
    if (btnOpts.button === false) { if (btn) btn.style.display = 'none'; return; }
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'kit-lang-btn';
      btn.type = 'button';
      btn.setAttribute('data-no-lang', '');
      btn.setAttribute('aria-label', 'English / 中文');
      document.body.appendChild(btn);
    }
    const pos = Object.assign({ top: 'calc(50% + 28px)', left: 'max(10px, env(safe-area-inset-left))' }, btnOpts.button || {});
    for (const side of ['top', 'right', 'bottom', 'left']) btn.style[side] = pos[side] == null ? '' : pos[side];
    btn.style.display = '';
    btn.innerHTML = ICON;
    btn.title = lang === 'zh' ? 'English' : '中文';
  }
  // Taps on the button never reach the game (like the ? button): one click switches the language.
  for (const type of ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click', 'dblclick']) {
    window.addEventListener(type, (e) => {
      if (!btn || !btn.contains(e.target)) return;
      e.stopImmediatePropagation();
      if (e.type === 'click') toggle();
    }, { capture: true, passive: false });
  }

  // ---------- start ----------
  function start() {
    applyAll();
    placeButton();
    observer.observe(document.body, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ATTRS });
  }
  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start, { once: true });

  // ---------- for the game, and for checking ----------
  // Judged by each text's English original against the dictionary as it is now, so strings asked for before the
  // game's js/zh.js loaded, and translations that keep a name ("Claude 自动驾驶"), don't show up.
  const needs = (s) => !!s && !kept.has(s) && looksEnglish(s) && lookup(s) == null;
  function untranslated() {
    const found = new Set([...askedMissing].filter(needs));
    if (document.body) {
      const it = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let n;
      while ((n = it.nextNode())) {
        if (n.nodeType === 1) {
          if (skipped(n)) continue;
          for (const a of ATTRS) {
            const en = (n.getAttribute('data-en-' + a) || n.getAttribute(a) || '').trim();
            if (n.hasAttribute(a) && needs(en)) found.add(en);
          }
          continue;
        }
        const en = (enText.get(n) ?? n.nodeValue).trim();
        if (skipped(n.parentNode) || !needs(en)) continue;
        found.add(en);
      }
    }
    return [...found];
  }

  Kit.lang = {
    get: () => lang,
    is: (l) => lang === l,
    set,
    toggle,
    t,
    add(d) { for (const k in d) dict.set(k.trim(), d[k]); if (document.body) applyAll(); },
    rule(re, rep) { rules.push([re, rep]); if (document.body) applyAll(); },
    keep(list) { for (const s of list) kept.add(String(s).trim()); },
    onChange(cb) { listeners.push(cb); },
    setup(o) { btnOpts = o || {}; if (document.body) placeButton(); },
    apply: applyAll,
    untranslated,
    button: () => btn,
    icon: ICON,
  };
})();

</script>
<script>
/* Kit.help: press ? (Shift + /) in any game, or tap the round ? button, to see that game's keys.

   The game freezes while the panel is open, without the game having to know:
   - its animation frames are held back, and the clock skips the time the panel was open (performance.now() and the
     frame timestamps both), so nothing moves and no timer runs out;
   - the sound pauses;
   - keys and taps go to the panel, never to the game.
   Any key (or a tap anywhere) closes it, and the game carries on from the exact frame it stopped on. Typing in a text
   box (Magic 8's question) never opens it.

   Load it last of the kit scripts, before the game's own, so it hears keys and taps first. Then, in the game:

     Kit.help.setup({
       title: 'Metro Surfer',
       cols: ['Player 1', 'Player 2'],                   // optional column heads, for 2-player games
       keys: [
         ['move', 'W A S D', '← ↑ ↓ →'],                  // what it does, then the keys for each column
         ['call your brother', 'T', 'Enter'],
       ],
       note: 'In 1 player both sets of keys work.',       // optional line under the keys
       touch: 'Swipe to move, tap to jump.',              // optional: how it plays on a phone or tablet
       button: { top: '12px', right: '60px' },            // where the ? button sits (CSS; default: middle of the left edge), or false
     });

   A key string is split at spaces. Each piece becomes a keycap, except lowercase words ("or", "hold", "click",
   "tap", "swipe", "double-tap") and "+", "·", "," and "–", which stay plain text. Write keys as A, Space, Enter, Esc,
   Shift, Tab, ←, ↑, → and ↓. */
(function () {
  const Kit = (window.Kit = window.Kit || {});

  let opts = { title: document.title, keys: [] };
  let isOpen = false, root = null, btn = null;

  // ---------- the freeze ----------
  const rafReal = window.requestAnimationFrame.bind(window);
  const nowReal = performance.now.bind(performance);
  let frozenAt = 0, offset = 0, lastT = 0, held = [], soundWasOn = false;

  performance.now = () => (isOpen ? frozenAt : nowReal()) - offset;
  window.requestAnimationFrame = (cb) => {
    if (isOpen) { held.push(cb); return 0; }
    return rafReal((t) => {
      lastT = Math.max(lastT, t - offset); // never backwards, so no game ever sees a negative dt
      cb(lastT);
    });
  };

  function freeze() {
    frozenAt = nowReal();
    const s = Kit.sound;
    soundWasOn = !!(s && s.isRunning && s.isRunning()); // only wake it again if it was playing when we stopped it
    if (soundWasOn) s.suspend();
  }
  function thaw() {
    offset += nowReal() - frozenAt;
    const cbs = held;
    held = [];
    for (const cb of cbs) window.requestAnimationFrame(cb);
    if (soundWasOn && Kit.sound.resume) Kit.sound.resume();
  }

  // ---------- open / close ----------
  function open() {
    if (isOpen) return;
    build();
    render();
    freeze();
    isOpen = true;
    root.classList.add('on');
    if (btn) btn.classList.add('on');
  }
  function close() {
    if (!isOpen) return;
    isOpen = false;
    root.classList.remove('on');
    if (btn) btn.classList.remove('on');
    thaw();
  }

  // ---------- keys and taps: the panel hears them first ----------
  const MODIFIERS = new Set(['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Fn', 'FnLock', 'OS', 'Hyper', 'Super']);
  function typing(e) {
    const t = e.target;
    return !!t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ''));
  }
  function swallow(e) {
    e.stopImmediatePropagation();
    if (!e.metaKey && !e.ctrlKey) e.preventDefault(); // leave browser shortcuts (reload, zoom) alone
  }
  window.addEventListener('keydown', (e) => {
    if (isOpen) {
      swallow(e);
      if (!e.repeat && !MODIFIERS.has(e.key)) close();
      return;
    }
    const isQ = e.key === '?' || (e.code === 'Slash' && e.shiftKey); // Shift + / on any keyboard layout
    if (isQ && !typing(e) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      swallow(e); // also keeps the / key from firing in games that use it (Tank TT, Snow TT Bros)
      if (!e.repeat) open();
    }
  }, true);
  window.addEventListener('keypress', (e) => { if (isOpen) swallow(e); }, true);
  // keyup always reaches the game, so a key held down when the panel opened is never stuck afterwards

  const POINTER = ['pointerdown', 'pointerup', 'pointermove', 'pointercancel', 'mousedown', 'mouseup', 'mousemove',
    'touchstart', 'touchmove', 'touchend', 'touchcancel', 'click', 'dblclick', 'contextmenu', 'wheel'];
  function onPointer(e) {
    const onBtn = btn && btn.contains(e.target);
    if (!isOpen && !onBtn) return;
    e.stopImmediatePropagation(); // no preventDefault on touches: a phone would then never send the click
    if (e.type === 'contextmenu') e.preventDefault();
    if (e.type !== 'click') return; // pointerdown and pointerup are swallowed, so one tap is one click
    const hit = (sel) => isOpen && e.target.closest && e.target.closest(sel);
    if (Kit.lang && hit('#kit-help .kh-lang')) Kit.lang.toggle(); // both stay open
    else if (Kit.sound && Kit.sound.onMute && hit('#kit-help .kh-sound')) Kit.sound.toggleMute();
    else (isOpen ? close() : open());
  }
  for (const t of POINTER) window.addEventListener(t, onPointer, { capture: true, passive: false });

  // ---------- the panel ----------
  const CSS = `
#kit-help { position: fixed; inset: 0; z-index: 2147483000; display: none; align-items: center; justify-content: center;
  padding: 16px; background: rgba(12, 10, 24, 0.62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  font-family: 'Rubik', system-ui, -apple-system, sans-serif; color: #fff; cursor: pointer; }
#kit-help.on { display: flex; }
#kit-help .kh-card { width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px 16px;
  border-radius: 22px; background: rgba(20, 18, 31, 0.94); border: 3px solid #fff; box-shadow: 0 8px 0 #000, 0 18px 40px rgba(0, 0, 0, 0.45);
  animation: kh-pop 0.22s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes kh-pop { from { transform: scale(0.85); } } /* no fade: the card shows even where animations don't run */
#kit-help .kh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#kit-help .kh-tag { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #18d4ff; }
#kit-help .kh-btns { display: flex; gap: 8px; }
#kit-help .kh-lang, #kit-help .kh-sound { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: transparent; color: #fff;
  cursor: pointer; }
#kit-help .kh-lang svg, #kit-help .kh-sound svg { width: 18px; height: 18px; }
#kit-help .kh-sound.off { background: rgba(120, 20, 40, 0.75); }
#kit-help .kh-lang:hover, #kit-help .kh-sound:hover { background: #ffd400; color: #14121f; border-color: #14121f; }
#kit-help h2 { margin: 2px 0 12px; font-family: 'Rubik', system-ui, sans-serif; font-weight: 800; /* not Bungee: it's all caps and would lose the TT in FlaTTy */
  font-size: clamp(24px, 5vw, 32px); line-height: 1.05; color: #ffd400; text-shadow: 0 3px 0 #000; }
#kit-help table { width: 100%; border-collapse: collapse; }
#kit-help th { padding: 0 6px 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-align: left; color: #8cc2ff; }
#kit-help th + th { color: #ffb02e; }
#kit-help td { padding: 5px 6px; vertical-align: middle; font-size: 15px; font-weight: 700; border-top: 1px solid rgba(255, 255, 255, 0.12); }
#kit-help td:first-child { width: 40%; color: #ffe9a8; }
#kit-help td.kh-k { white-space: normal; line-height: 2; font-weight: 600; font-size: 13px; color: #d9d6e8; }
#kit-help kbd { display: inline-block; min-width: 26px; height: 26px; padding: 0 7px; margin: 0 2px; border-radius: 7px;
  background: #fff; color: #14121f; font: 800 13px/26px 'Rubik', system-ui, sans-serif; text-align: center;
  box-shadow: 0 3px 0 #7d7a90; vertical-align: middle; }
#kit-help .kh-note { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: #ffe9a8; }
#kit-help .kh-touch { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: #c3f0d6; }
#kit-help .kh-foot { margin-top: 12px; font-size: 13px; font-weight: 700; text-align: center; opacity: 0.8; }
#kit-help-btn { position: fixed; z-index: 2147482000; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  border: 3px solid #fff; background: rgba(20, 18, 31, 0.62); color: #fff; cursor: pointer;
  font: 800 22px/34px 'Rubik', system-ui, sans-serif; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#kit-help-btn:hover, #kit-help-btn.on { background: #ffd400; color: #14121f; border-color: #14121f; }
@media (max-height: 520px) { #kit-help td { padding: 3px 6px; } #kit-help h2 { margin-bottom: 6px; } }
`;
  function build() {
    if (root) return;
    const style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);
    root = document.createElement('div');
    root.id = 'kit-help';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Keys');
    document.body.appendChild(root);
  }

  const PLAIN = new Set(['+', '·', ',', '–']);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // English or 中文 through Kit.lang (kit/lang.js) when the game loads it: t(text) uses the game's dictionary,
  // t(en, zh) is an inline pair for the panel's own words.
  const t = (en, zh) => (Kit.lang ? Kit.lang.t(en, zh) : en);
  const plain = (w) => /^[a-z][a-z-]+$/.test(w) || PLAIN.has(w);
  function keycaps(str) {
    if (!str) return '';
    const words = String(str).split(/\s+/).filter(Boolean);
    if (words.every(plain)) return ` ${esc(t(String(str)))} `; // all words ("hold the mouse button and drag"): translate as one
    return words.map((w) => (plain(w) ? ` ${esc(t(w))} ` : `<kbd>${esc(t(w))}</kbd>`)).join('');
  }
  function render() {
    const o = opts;
    const cols = o.cols || [];
    const zh = Kit.lang && Kit.lang.is('zh');
    let html = `<div class="kh-card"><div class="kh-top"><div class="kh-tag">${t('? KEYS', '? 按键')}</div><div class="kh-btns">`;
    const s = Kit.sound;
    if (s && s.onMute) html += `<button type="button" class="kh-sound${s.isMuted() ? ' off' : ''}" title="${t('Sound on / off')}" aria-label="${t('Sound on / off')}" aria-pressed="${s.isMuted()}">${s.icon()}</button>`;
    if (Kit.lang) html += `<button type="button" class="kh-lang" title="${zh ? 'English' : '中文'}" aria-label="English / 中文">${Kit.lang.icon}</button>`;
    html += `</div></div><h2>${esc(t(o.title || ''))}</h2><table>`;
    if (cols.length) html += `<tr><th></th>${cols.map((c) => `<th>${esc(t(c))}</th>`).join('')}</tr>`;
    for (const row of o.keys || []) {
      const [label, ...ks] = row;
      html += `<tr><td>${esc(t(label))}</td>${ks.map((k) => `<td class="kh-k">${keycaps(k)}</td>`).join('')}</tr>`;
    }
    html += `<tr><td>${t('these keys', '看按键')}</td><td class="kh-k" colspan="${Math.max(1, cols.length)}">${keycaps('?')} ${t('or tap the round', '或点圆形')} ${keycaps('?')} ${t('button', '按钮')}</td></tr>`;
    html += '</table>';
    if (o.note) html += `<div class="kh-note">${esc(t(o.note))}</div>`;
    if (o.touch) html += `<div class="kh-touch">👆 ${esc(t(o.touch))}</div>`;
    html += `<div class="kh-foot">⏸ ${t('The game waits for you. Press any key or tap to play on.', '游戏在等你。按任意键或点一下，继续玩。')}</div></div>`;
    root.innerHTML = html;
  }
  if (Kit.lang) Kit.lang.onChange(() => { if (isOpen) render(); });
  if (Kit.sound && Kit.sound.onMute) Kit.sound.onMute(() => { if (isOpen) render(); });

  function placeButton() {
    if (opts.button === false) { if (btn) btn.style.display = 'none'; return; }
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'kit-help-btn';
      btn.type = 'button';
      btn.textContent = '?';
      btn.title = 'Keys (?)';
      btn.setAttribute('aria-label', 'Show the keys');
      build();
      document.body.appendChild(btn);
    }
    // The same spot in every game, the middle of the left edge: corners hold scores, pause buttons and touch pads.
    const pos = Object.assign({ top: 'calc(50% - 20px)', left: 'max(10px, env(safe-area-inset-left))' }, opts.button || {});
    for (const side of ['top', 'right', 'bottom', 'left']) btn.style[side] = pos[side] == null ? '' : pos[side];
    btn.style.display = '';
  }

  function setup(o) {
    opts = Object.assign({ title: document.title, keys: [] }, o || {});
    const go = () => { placeButton(); if (isOpen) render(); };
    if (document.body) go();
    else document.addEventListener('DOMContentLoaded', go, { once: true });
  }

  Kit.help = { setup, open, close, toggle: () => (isOpen ? close() : open()), isOpen: () => isOpen, button: () => btn };
})();

<script>

   A working title until Alan names it: renaming the game is a one-line change here. */
